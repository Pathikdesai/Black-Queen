<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1626">
<title>Black Queen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Black Queen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cw:56px;--ch:80px;--crank:20px;--cpip:19px;--cval:13px;--ink:#0F1626;--felt:#182338;--felt2:#1F2C46;--brass:#C9992E;--brass-dim:#8A6A21;
--bone:#EFE7D6;--bone-dim:#C9C0AE;--crimson:#B8383D;--jade:#3E8F7C;--muted:#7C88A0;--line:rgba(201,153,46,.22);--fade:16,24,40;--surf:#1F2C46;--surf2:#141E33}
body.baize{--ink:#062C1B;--felt:#0C5231;--felt2:#12703F;--brass:#E0AE3A;--brass-dim:#9A7823;
--bone:#F4EEDF;--bone-dim:#D3D8CB;--crimson:#C4413F;--jade:#7FD8A6;--muted:#A6C4B0;
--line:rgba(224,174,58,.30);--fade:6,44,27;--surf:#0E5A36;--surf2:#083F26}
body.baize{background:radial-gradient(120% 80% at 50% -12%,#1B8A4F 0%,#0C5231 46%,#062C1B 100%)}
body.baize .handwrap{background:rgba(0,0,0,.30)}
body.baize .card{box-shadow:0 3px 10px rgba(0,0,0,.42)}
body.baize .tm.oppside{background:rgba(0,0,0,.20);border-color:rgba(255,255,255,.13)}
body.baize .seat{background:rgba(0,0,0,.20)}
body.baize .log{color:#CFE3D6}
@media (max-width:360px){
  :root{--cw:50px;--ch:72px;--crank:18px;--cpip:17px;--cval:12px}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#24314C 0%,var(--felt) 45%,var(--ink) 100%);
color:var(--bone);font-family:'Archivo',system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
h1,h2,h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:600}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ribbon{display:flex;align-items:center;flex-wrap:wrap;gap:7px 9px;padding:9px 12px;border-bottom:1px solid var(--line);
background:linear-gradient(180deg,rgba(201,153,46,.10),transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
.ribbon .deal{font-family:'Bodoni Moda',serif;font-size:13px;color:var(--brass);letter-spacing:.08em;text-transform:uppercase}
.spacer{flex:1 1 0;min-width:0}
.chipline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bone-dim)}
.trumpbadge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--brass);border-radius:999px;
padding:2px 9px;font-weight:600;color:var(--brass);font-size:12px}
.iconbtn{background:none;border:1px solid var(--line);color:var(--bone-dim);border-radius:8px;padding:4px 9px;
font-size:12px;font-family:inherit;cursor:pointer}
.iconbtn:hover{border-color:var(--brass);color:var(--brass)}
.seats{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.seats::-webkit-scrollbar{display:none}
.seat{flex:0 0 auto;min-width:74px;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 9px;
background:rgba(255,255,255,.03);position:relative;transition:.2s}
.seat.turn{border-color:var(--brass);background:rgba(201,153,46,.13);box-shadow:0 0 0 1px rgba(201,153,46,.25)}
.seat.out{opacity:.45}
/* The card count and the clock sit on top of these two lines, so each reserves
   the room they need. A seat is sized by its widest line, so the padding grows
   the seat rather than squashing anything: a long name pushes the box out
   instead of running underneath the number. */
.seat .nm{font-size:12px;font-weight:600;white-space:nowrap;color:var(--bone-dim);padding-right:20px}
.seat.you .nm{color:var(--bone)}
.seat .sc{font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.1;color:var(--bone);padding-right:28px}
.seat .tag{font-size:9px;letter-spacing:.09em;text-transform:uppercase;margin-top:2px;min-height:12px}
.tag.bid{color:var(--brass)}.tag.mate{color:var(--jade)}.tag.dim{color:var(--muted)}
.seat .cnt{position:absolute;top:6px;right:7px;font-size:10px;color:var(--muted)}
/* Turn clock. Stays out of the way until the last twenty seconds, then counts
   down, then goes red, so a table only sees it when somebody has actually
   stalled rather than every single turn. */
/* Sat beside the score rather than above the name: the score is short and the
   space to its right is the only part of a seat that is reliably empty. */
.seat .clk{position:absolute;top:27px;right:8px;font-size:10px;font-weight:700;color:var(--brass);
 letter-spacing:.04em;opacity:0;transition:opacity .25s}
.seat .clk.on{opacity:1}
.seat .clk.urgent{color:var(--crimson);animation:clkPulse .9s ease-in-out infinite}
@keyframes clkPulse{0%,100%{opacity:1}50%{opacity:.35}}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--jade);margin-right:4px;vertical-align:1px}
.dot.off{background:var(--crimson)}
@keyframes bannerIn{0%{opacity:0;transform:translateY(14px) scale(.86)}
 14%{opacity:1;transform:translateY(0) scale(1.04)}22%{transform:scale(1)}
 78%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-12px) scale(.97)}}
.banner{position:fixed;left:0;right:0;top:31%;z-index:60;display:flex;flex-direction:column;
 align-items:center;pointer-events:none;animation:bannerIn 1.75s cubic-bezier(.2,.8,.3,1) forwards}
.banner .bt{font-family:'Bodoni Moda',serif;font-size:34px;letter-spacing:.02em;line-height:1;
 text-align:center;padding:0 22px;text-shadow:0 3px 20px rgba(0,0,0,.75)}
.banner .bs{margin-top:7px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--bone-dim);
 text-shadow:0 2px 10px rgba(0,0,0,.8)}
.contract{position:fixed;inset:0;z-index:62;display:flex;align-items:center;justify-content:center;
 background:rgba(9,14,24,.62);backdrop-filter:blur(3px);pointer-events:none;
 animation:cIn .28s ease both, cOut .4s ease 2.7s both}
@keyframes cIn{from{opacity:0}to{opacity:1}}
@keyframes cOut{to{opacity:0}}
.contract .box{background:linear-gradient(165deg,var(--surf),var(--surf2));border:1px solid var(--brass);
 border-radius:18px;padding:22px 26px 20px;text-align:center;min-width:236px;
 box-shadow:0 22px 60px rgba(0,0,0,.6);animation:cPop .42s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cPop{from{transform:scale(.8) translateY(16px)}to{transform:none}}
.contract .lab{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.contract .suit{font-family:'Bodoni Moda',serif;font-size:76px;line-height:1.02;margin:2px 0 0}
.contract .sname{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:13px}
.contract .who{font-size:14px;color:var(--bone);margin-bottom:3px}
.contract .who b{color:var(--brass);font-family:'Bodoni Moda',serif;font-size:19px}
.contract .calls{margin-top:11px;padding-top:11px;border-top:1px solid rgba(201,153,46,.28)}
.contract .calls .cc{font-family:'Bodoni Moda',serif;font-size:21px;margin:0 5px}
.banner.q .bt{color:#f2f0e8}.banner.q .bt::after{content:'';display:block;margin:9px auto 0;width:56px;height:2px;background:var(--brass)}
.banner.cut .bt{color:var(--brass)}
.banner.pot .bt{color:var(--jade)}
.banner.prt .bt{color:var(--jade);font-size:27px}
@keyframes flyIn{from{opacity:0;transform:translateY(26px) scale(.82) rotate(var(--tilt,0deg))}
 to{opacity:1;transform:none}}
.played.nw{animation:flyIn .26s cubic-bezier(.22,.9,.3,1) both}
@keyframes sweep{to{opacity:0;transform:translate(var(--dx,0),-30px) scale(.7)}}
.trickarea.sweep .played{animation:sweep .34s ease-in forwards}
@keyframes nope{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}46%{transform:translateX(5px)}72%{transform:translateX(-3px)}}
.card.nope{animation:nope .3s ease}
.iconbtn.hagga{color:var(--brass);border-color:var(--brass);font-weight:600;letter-spacing:.04em}
.iconbtn.hagga:active{background:rgba(201,153,46,.2)}
.iconbtn.hagga.cool{opacity:.4;border-color:var(--line);color:var(--muted)}
.flashbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
 z-index:58;background:rgba(15,22,38,.95);border:1px solid var(--line);color:var(--bone);
 padding:8px 15px;border-radius:999px;font-size:12.5px;pointer-events:none;
 box-shadow:0 8px 26px rgba(0,0,0,.5);transition:opacity .3s;opacity:1}
.flashbar.out{opacity:0}
.sumgrid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:11px 0 2px;font-size:12.5px}
.sumgrid .k{color:var(--muted)}
.sumgrid .v{color:var(--bone);text-align:right}
.sumgrid .v b{color:var(--brass)}
.teams{display:flex;flex-direction:column;gap:5px;padding:0 12px 8px}
.tm{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;font-size:12.5px}
.tm.bidside{background:rgba(201,153,46,.13);border:1px solid rgba(201,153,46,.38)}
.tm.oppside{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)}
.tm .lb{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto;width:62px;line-height:1.25}
.tm.bidside .lb{color:var(--brass)}
.tm .nms{flex:1;color:var(--bone);line-height:1.3}
.tm .nms .u{color:var(--jade);font-weight:600}
.tm .pt{font-family:'Bodoni Moda',serif;font-size:19px;flex:0 0 auto;min-width:30px;text-align:right}
.tm.bidside .pt{color:var(--brass)}
.tm.oppside .pt{color:var(--bone-dim)}
.seat.tside{background:rgba(201,153,46,.11);border-color:rgba(201,153,46,.4)}
.table{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 12px 12px;min-height:206px}
.trickarea{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:flex-end;min-height:120px}
/* A full trick has one card per seat and must never wrap, so the cards are
   sized from the actual seat count and the width the phone really has. */
.trickarea{--tn:6}
.trickarea .card{
 --cw:clamp(38px, calc((min(100vw,560px) - 30px - (var(--tn) - 1) * 7px) / var(--tn)), 54px);
 --ch:calc(var(--cw)*1.43);
 --crank:calc(var(--cw)*.37);--cpip:calc(var(--cw)*.35);--cval:calc(var(--cw)*.23)}
.played{text-align:center;animation:drop .22s ease-out}
@keyframes drop{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.played .who{font-size:10px;color:var(--muted);margin-top:3px}
.card{width:var(--cw);height:var(--ch);border-radius:7px;background:linear-gradient(160deg,#FBF6EA,#E4DAC4);color:#17202F;
position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;
box-shadow:0 3px 8px rgba(0,0,0,.4);border:1px solid rgba(0,0,0,.15);font-family:'Bodoni Moda',Georgia,serif;
user-select:none;flex:0 0 auto}
.card .r{font-size:var(--crank);font-weight:700;line-height:1}
.card .p{font-size:var(--cpip);line-height:1;align-self:flex-end}
.card.su-S{color:#17202F}
.card.su-H{color:#B8383D}
.card.su-D{color:#1F63A8}
.card.su-C{color:#26714A}
.card.gap{margin-left:12px}
/* Armed for play, waiting on a second tap. Lifted clear of the row so it reads
   at a glance on a crowded hand. */
.card.sel{transform:translateY(-13px);box-shadow:0 0 0 2px var(--brass),0 10px 22px rgba(0,0,0,.55);z-index:2}
.card.tr{background:linear-gradient(160deg,#FFF7E2,#EEDFB6);border-color:rgba(201,153,46,.55)}
.card.tr::after{content:'';position:absolute;left:4px;right:4px;bottom:2px;height:2.5px;
border-radius:2px;background:var(--brass)}
.card.qs{background:linear-gradient(160deg,#EFE7D6,#CFC3A6);box-shadow:0 0 0 1.5px var(--brass),0 3px 10px rgba(0,0,0,.5)}
.card .val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--cval);font-weight:700;
color:rgba(23,32,47,.32)}
.card.qs .val{color:var(--brass-dim)}
.handwrap{border-top:1px solid var(--line);background:rgba(0,0,0,.22);padding:10px 0 12px}
.handlabel{display:flex;justify-content:space-between;padding:0 14px 7px;font-size:11px;letter-spacing:.09em;
text-transform:uppercase;color:var(--muted)}
.hand{display:flex;gap:5px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none;
 -webkit-overflow-scrolling:touch;scroll-behavior:auto;position:relative;
 -webkit-mask-image:none;mask-image:none}
.hand::-webkit-scrollbar{height:0}
.hand.grab{cursor:grabbing;user-select:none}
.handpan{position:relative}
.handpan::before,.handpan::after{content:'';position:absolute;top:0;bottom:8px;width:28px;
 pointer-events:none;opacity:0;transition:opacity .18s;z-index:3}
.handpan::before{left:0;background:linear-gradient(90deg,rgb(var(--fade)),rgba(var(--fade),0))}
.handpan::after{right:0;background:linear-gradient(270deg,rgb(var(--fade)),rgba(var(--fade),0))}
.handpan.fl::before{opacity:1}
.handpan.fr::after{opacity:1}
.hand::-webkit-scrollbar{display:none}
.hand .card{cursor:pointer;transition:transform .15s,opacity .15s}
.hand .card.ok:active,.hand .card.ok:hover{transform:translateY(-9px)}
.hand .card.no{opacity:.32;cursor:not-allowed;filter:grayscale(.5)}
.panel{padding:12px 14px 16px;border-top:1px solid var(--line);background:rgba(15,22,38,.92)}
.panel h3{margin:0 0 3px;font-size:17px}
.panel p{margin:0 0 10px;font-size:13px;color:var(--bone-dim);line-height:1.45}
.row{display:flex;gap:7px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:10px 15px;border-radius:9px;border:1px solid var(--brass);
background:var(--brass);color:#16202F;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brass)}
.btn.quiet{border-color:rgba(255,255,255,.18);color:var(--bone-dim);background:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.wide{flex:1}
.btn.block{width:100%;flex:0 0 auto}
.suitbtn{width:52px;height:52px;font-size:24px;display:flex;align-items:center;justify-content:center;
border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--bone);border-radius:10px;
cursor:pointer;font-family:'Bodoni Moda',serif}
.suitbtn.su-S{color:#C7D1E6}.suitbtn.su-H{color:#E4696E}
.suitbtn.su-D{color:#6BA6E0}.suitbtn.su-C{color:#5FBE8E}
.suitbtn.on{border-color:var(--brass);background:rgba(201,153,46,.18);color:var(--brass)}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.stepper .amt{font-family:'Bodoni Moda',serif;font-size:38px;line-height:1;min-width:82px;text-align:center;color:var(--brass)}
.step{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--brass);
font-size:21px;cursor:pointer;font-family:inherit}
.step:disabled{opacity:.3}
.callrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.callchip{border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 10px;font-family:'Bodoni Moda',serif;
font-size:16px;cursor:pointer;background:rgba(255,255,255,.04);color:var(--bone)}
.callchip.su-S{color:#C7D1E6}.callchip.su-H{color:#E4696E}
.callchip.su-D{color:#6BA6E0}.callchip.su-C{color:#5FBE8E}
.callsuit{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.callsuit .sl{font-family:'Bodoni Moda',serif;font-size:20px;width:20px;flex:0 0 auto;text-align:center}
.callsuit .sl.su-S{color:#C7D1E6}.callsuit .sl.su-H{color:#E4696E}
.callsuit .sl.su-D{color:#6BA6E0}.callsuit .sl.su-C{color:#5FBE8E}
.callscroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.callscroll::-webkit-scrollbar{display:none}
.callchip.mini{padding:5px 9px;font-size:15px;flex:0 0 auto;min-width:34px;text-align:center}
.callchip.on{border-color:var(--brass);background:rgba(201,153,46,.2);color:var(--brass)}
.hint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.log{max-height:118px;overflow-y:auto;padding:8px 14px;font-size:12px;color:var(--muted);
border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.log b{color:var(--bone-dim)}.log .hi{color:var(--brass)}.log .jd{color:var(--jade)}
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.82);display:flex;align-items:center;justify-content:center;
padding:18px;z-index:60;backdrop-filter:blur(3px)}
.modal{background:var(--felt2);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;
max-height:86vh;overflow-y:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:24px;color:var(--brass)}
.modal p,.modal li{font-size:13.5px;color:var(--bone-dim);line-height:1.55}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 20px;gap:14px}
.home h1{font-size:46px;margin:0;line-height:.95;letter-spacing:-.01em}
.home h1 span{color:var(--brass)}
.home .sub{color:var(--muted);font-size:14px;margin:0 0 8px}
.fld{display:block;width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
background:rgba(255,255,255,.05);color:var(--bone);font-family:inherit;font-size:16px;margin-bottom:9px}
.fld:focus{outline:none;border-color:var(--brass)}
.fld.code{text-transform:uppercase;letter-spacing:.32em;font-family:'Bodoni Moda',serif;font-size:22px;text-align:center}
.codebox{font-family:'Bodoni Moda',serif;font-size:44px;letter-spacing:.18em;color:var(--brass);text-align:center;
padding:14px;border:1px dashed var(--line);border-radius:12px;margin-bottom:12px}
.lob{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.lobrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;
background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:14px}
.lobrow .em{font-size:11px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--felt2);
border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:74vh;display:flex;flex-direction:column;
box-shadow:0 -8px 26px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .24s ease}
.sheet.open{transform:none}
.sheet .sh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sheet .sh h3{margin:0;font-size:17px;color:var(--brass)}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:130px}
.msg{max-width:82%;padding:8px 11px;border-radius:11px;background:rgba(255,255,255,.06);font-size:14px;line-height:1.35}
.msg .who{font-size:10.5px;color:var(--brass);letter-spacing:.05em;margin-bottom:2px}
.msg.mine{align-self:flex-end;background:rgba(201,153,46,.18);border:1px solid rgba(201,153,46,.3)}
.msg.mine .who{color:var(--bone-dim)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:9px 14px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qb{flex:0 0 auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--bone-dim);
border-radius:999px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.qb:active{border-color:var(--brass);color:var(--brass)}
.compose{display:flex;gap:7px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.compose input{flex:1;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
background:rgba(255,255,255,.05);color:var(--bone);font-family:inherit;font-size:16px}

<body>
<div class="wrap" id="root"></div>
<script>
const SUITS=['S','H','D','C'];
const SYM={S:'\u2660',H:'\u2665',D:'\u2666',C:'\u2663'};
const NAME={S:'Spades',H:'Hearts',D:'Diamonds',C:'Clubs'};
const RED={H:1,D:1};
const RANKS=['5','6','7','8','9','10','J','Q','K','A'];
const MINBID=100,MAXBID=200,STEP=5;
const ptsOf=c=>(c.r==='5'||c.r==='10')?5:c.r==='A'?10:(c.r==='Q'&&c.s==='S')?20:0;

/* storage that never throws */
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- sound, synthesised in the browser ---------- */
let AC=null, muted=store.get('bq_mute')==='1', lastFx=0;
function ac(){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null}
}
/* Priming is starting every clip and stopping it again, so that a later play()
   counts as something the player asked for rather than the page helping itself
   to the speaker. It has to be inaudible while it happens.

   It was using volume for that, which is fine on a desktop and useless on an
   iPhone: Apple makes volume read only on iOS and quietly ignores writes, so
   every clip in the sound pack was being primed at FULL volume and the whole
   pack blurted out the moment the game started. muted is honoured everywhere,
   so that is what silences it now.

   The pause is guarded, because priming resolves asynchronously. If a clip is
   genuinely wanted in the gap between play() and the promise settling, the
   prime must not reach in afterwards and stop it. */
function primeClips(){
  Object.values(audioCache).forEach(a=>{
    try{
      a.muted=true;
      a._priming=true;
      const done=()=>{
        if(a._priming){ try{ a.pause(); a.currentTime=0; }catch(e){} }
        a._priming=false; a.muted=false;
      };
      const q=a.play();
      if(q&&q.then)q.then(done).catch(()=>{ a._priming=false; a.muted=false; });
      else done();
    }catch(e){ try{ a._priming=false; a.muted=false; }catch(e2){} }
  });
}
document.addEventListener('pointerdown',()=>{
  if(!muted){ ac(); holdSession(); }
  if(primed)return; primed=true;
  primeClips();
},{passive:true});

/* Leaving the app suspends the audio engine, and iOS in particular parks it in
   an "interrupted" state that does not always clear by itself when you come
   back. Waking it explicitly on return, and rearming the clips so the next tap
   re-primes them, since a backgrounded element can come back stalled. */
/* Three separate things go wrong with audio on a phone, and only one of them
   is fixed by resuming the context.

   1. The context is suspended when you leave the app. resume() handles that.
   2. Safari has a long standing bug where, after an interruption, the context
      says "running" but produces silence forever. The only cure is to close it
      and build a new one, so we detect it by checking the clock is moving.
   3. On iPhone the ringer switch silences Web Audio entirely. Holding a silent
      looping element open puts the page on the media channel instead, which
      ignores that switch. */
const SILENT_WAV='data:audio/wav;base64,UklGRtQEAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YbAEAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=';
let holder=null;
function holdSession(){
  try{
    if(!holder){
      holder=new Audio(SILENT_WAV);
      holder.loop=true; holder.volume=0.001;
      holder.setAttribute('playsinline','');
    }
    if(holder.paused){ const q=holder.play(); if(q&&q.catch)q.catch(()=>{}); }
  }catch(e){}
}
function rebuildClips(){
  Object.keys(audioCache).forEach(k=>{
    const old=audioCache[k];
    try{
      const a=new Audio('sounds/'+k);
      a.preload='auto';
      a.volume=old&&typeof old.volume==='number'?old.volume:0.9;
      a.addEventListener('canplaythrough',()=>{packStatus.files[k]='ok';},{once:true});
      a.addEventListener('error',()=>{packStatus.files[k]='missing';},{once:true});
      audioCache[k]=a;
    }catch(e){}
  });
}
function hardResetAudio(){
  try{ if(AC && AC.state!=='closed') AC.close(); }catch(e){}
  AC=null;
  ac();
  rebuildClips();
  primed=false;
  HAPTICS.last='audio engine rebuilt';
}
/* The clock only advances while the context is genuinely producing sound, so a
   frozen currentTime is the reliable tell for the silent-but-running bug. */
function checkAlive(then){
  if(!AC){ then(false); return; }
  const t0=AC.currentTime;
  setTimeout(()=>{ then(!!AC && AC.currentTime > t0); }, 260);
}
function wakeAudio(){
  if(muted)return;
  holdSession();
  try{
    if(!AC || AC.state==='closed'){ hardResetAudio(); }
    else if(AC.state==='suspended' || AC.state==='interrupted'){
      const q=AC.resume();
      if(q&&q.catch)q.catch(()=>hardResetAudio());
    }
  }catch(e){ hardResetAudio(); }
  Object.values(audioCache).forEach(a=>{ try{ if(a.readyState===0)a.load(); }catch(e){} });
  primed=false;
  // and if it claims to be fine but is not actually running, rebuild it
  setTimeout(()=>checkAlive(ok=>{ if(!ok) hardResetAudio(); }), 120);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wakeAudio(); });
window.addEventListener('pageshow',wakeAudio);
window.addEventListener('focus',wakeAudio);
function env(g,t,a,d,peak){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
}
function blip(f1,f2,dur,peak,type,at){
  const C=ac(); if(!C)return;
  const t=C.currentTime+(at||0);
  const o=C.createOscillator(), g=C.createGain();
  o.type=type||'triangle';
  o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,0.008,dur,peak);
  o.connect(g); g.connect(C.destination);
  o.start(t); o.stop(t+dur+0.06);
}
function noise(dur,peak,f0,f1,at){
  const C=ac(); if(!C)return;
  const t=C.currentTime+(at||0);
  const n=Math.floor(C.sampleRate*dur);
  const buf=C.createBuffer(1,n,C.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=C.createBufferSource(); src.buffer=buf;
  const bp=C.createBiquadFilter(); bp.type='bandpass'; bp.Q=1.1;
  bp.frequency.setValueAtTime(f0,t);
  bp.frequency.exponentialRampToValueAtTime(f1||f0,t+dur);
  const g=C.createGain(); env(g,t,0.006,dur,peak);
  src.connect(bp); bp.connect(g); g.connect(C.destination);
  src.start(t); src.stop(t+dur+0.05);
}
const SFX={
  card(){ noise(0.06,0.10,1700,900); },
  trumpcut(){ noise(0.20,0.30,5200,700); blip(520,120,0.24,0.22,'sawtooth',0.02); },
  queen(){ blip(196,196,0.30,0.20,'sine'); blip(147,147,0.42,0.17,'sine',0.10); },
  trickwin(){ blip(587,587,0.12,0.17,'triangle'); blip(880,880,0.20,0.15,'triangle',0.10); },
  bigpot(){ [523,659,784,1047].forEach((f,i)=>blip(f,f,0.14,0.13,'triangle',i*0.06)); },
  partner(){ blip(1047,1047,0.30,0.13,'sine'); blip(1568,1568,0.34,0.09,'sine',0.07); },
  contract(){ [392,494,587].forEach((f,i)=>blip(f,f,0.34,0.12,'triangle',i*0.05)); },
  yourturn(){ blip(784,784,0.10,0.14,'sine'); blip(1047,1047,0.14,0.12,'sine',0.09); },
  made(){ [523,659,784,1047].forEach((f,i)=>blip(f,f,0.24,0.14,'triangle',i*0.09)); },
  broken(){ [523,440,349,262].forEach((f,i)=>blip(f,f,0.26,0.13,'sawtooth',i*0.09)); },
  chat(){ blip(880,880,0.07,0.10,'sine'); }
};
/* ============ CUSTOM SOUND PACK ============
   Drop mp3 files in public/sounds/ and describe them in public/sounds/rules.json.
   Nothing here is required: if the folder is missing the game runs exactly as before. */
let PACK=[], packReady=false, packFired={}, primed=false;
const packStatus={ rules:null, files:{}, json:'loading' };
const audioCache={};
function loadPack(){
  fetch('sounds/rules.json',{cache:'no-cache'})
    .then(r=>{ packStatus.json=r.ok?'ok':('http '+r.status); return r.ok?r.json():null; })
    .then(j=>{ if(!Array.isArray(j))return;
      PACK=j.filter(r=>r&&r.when&&r.sound); packReady=true; packStatus.rules=PACK.length;
      PACK.forEach(r=>{ try{
        if(audioCache[r.sound])return;
        const a=new Audio('sounds/'+r.sound); a.preload='auto';
        a.volume=typeof r.volume==='number'?Math.max(0,Math.min(1,r.volume)):0.9;
        packStatus.files[r.sound]='loading';
        a.addEventListener('canplaythrough',()=>{packStatus.files[r.sound]='ok';},{once:true});
        a.addEventListener('error',()=>{packStatus.files[r.sound]='missing';},{once:true});
        audioCache[r.sound]=a;
      }catch(e){ packStatus.files[r.sound]='error'; } });
      console.log('sound pack loaded:',PACK.length,'rules');
    })
    .catch(e=>{ packStatus.json='failed'; });
}
const norm=x=>String(x==null?'':x).trim().toLowerCase();
function namesIn(d){
  const out=[];
  if(d.who)out.push(d.who);
  if(d.bidder)out.push(d.bidder);
  if(Array.isArray(d.team))out.push(...d.team);
  if(Array.isArray(d.winners))out.push(...d.winners);
  return out.map(norm);
}
function ruleMatches(r,e){
  if(norm(r.when)!==norm(e.n))return false;
  const d=e.d||{};
  // every listed player must be involved in this event
  if(Array.isArray(r.players)&&r.players.length){
    const pool=(r.when==='partner'||r.when==='sweep'||r.when==='gamewinner')&&Array.isArray(d.team)
      ?d.team.map(norm):namesIn(d);
    // a nested array means "any one of these will do"
    const ok=r.players.every(x=>Array.isArray(x)
      ?x.some(y=>pool.includes(norm(y)))
      :pool.includes(norm(x)));
    if(!ok)return false;
  }
  if(r.player){
    const want=Array.isArray(r.player)?r.player.map(norm):[norm(r.player)];
    if(!want.includes(norm(d.who))&&!want.includes(norm(d.bidder)))return false;
  }
  if(r.side&&norm(r.side)!==norm(d.side))return false;
  if(r.when==='partner'&&r.settled&&!d.settled)return false;
  if(r.sole===true&&!d.sole)return false;
  if(typeof r.minPoints==='number'&&!(d.pts>=r.minPoints))return false;
  if(r.trump&&norm(d.trump||d.suit)!==norm(r.trump))return false;
  if(typeof r.minBid==='number'&&!(d.amount>=r.minBid))return false;
  return true;
}
function packPlay(r){
  if(muted)return;
  const a=audioCache[r.sound];
  if(!a){ console.warn('sound pack: no audio for',r.sound); return; }
  // this one is wanted for real, so a prime still in flight must keep its hands off
  a._priming=false; a.muted=false;
  try{ a.currentTime=0; const q=a.play();
    if(q&&q.catch)q.catch(e=>console.warn('sound pack: blocked or missing',r.sound,e&&e.name)); }catch(e){}
  if(r.text)flash(r.text);
  if(r.buzz)buzz([18,60,18]);
}
function runPack(evts){
  if(!packReady||!PACK.length)return;
  evts.forEach(e=>{
    PACK.forEach((r,i)=>{
      if(!ruleMatches(r,e))return;
      const scope=r.once||'deal';
      const key=i+'|'+(scope==='deal'?('d'+V.dealNo):scope==='game'?'g':Math.random());
      if(scope!=='always'&&packFired[key])return;
      packFired[key]=1;
      packPlay(r);
    });
  });
}
/* The game screen is rebuilt on every state push, so this runs hundreds of
   times per game. The window level drag listeners are therefore installed
   exactly once and simply read whichever hand is current, otherwise they pile
   up and the page crawls to a halt by the last round. */
let handEl=null, dragging=false, dragX=0, dragFrom=0, dragMoved=0, handWired=false;
function handMax(){ return handEl ? handEl.scrollWidth - handEl.clientWidth : 0; }
function handFades(){
  if(!handEl)return;
  const w=handEl.parentElement; if(!w)return;
  w.classList.toggle('fl',handEl.scrollLeft>4);
  w.classList.toggle('fr',handEl.scrollLeft<handMax()-4);
}
function installHandListeners(){
  if(handWired)return; handWired=true;
  window.addEventListener('mousemove',e=>{
    if(!dragging||!handEl)return;
    const d=e.clientX-dragX;
    dragMoved=Math.max(dragMoved,Math.abs(d));
    if(dragMoved>3){ handEl.scrollLeft=Math.max(0,Math.min(handMax(),dragFrom-d)); e.preventDefault(); }
  });
  window.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;
    if(handEl){
      handEl.classList.remove('grab');
      if(dragMoved>6){ handEl.classList.add('dragged'); setTimeout(()=>{ if(handEl)handEl.classList.remove('dragged'); },0); }
    }
  });
}
function wireHand(el){
  handEl=el;
  if(!el)return;
  installHandListeners();
  el.scrollLeft=handScroll;
  // these live on the element itself, so they die with it on the next rebuild
  el.addEventListener('scroll',()=>{ handScroll=el.scrollLeft; handFades(); },{passive:true});
  el.addEventListener('wheel',e=>{
    const max=handMax(); if(max<=0)return;
    const dx=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if(!dx)return;
    const before=el.scrollLeft;
    el.scrollLeft=Math.max(0,Math.min(max,before+dx));
    if(el.scrollLeft!==before)e.preventDefault();
  },{passive:false});
  el.addEventListener('mousedown',e=>{
    if(e.button!==0||handMax()<=0)return;
    dragging=true; dragMoved=0; dragX=e.clientX; dragFrom=el.scrollLeft; el.classList.add('grab');
  });
  el.addEventListener('click',e=>{ if(el.classList.contains('dragged')){ e.stopPropagation(); e.preventDefault(); } },true);
  handFades();
}
/* Table cloth. Green baize is the default because it reads far better in
   normal room light than the dark blue did, especially on smaller screens. */
function tableTheme(){ return store.get('bq_table')||'baize'; }
function applyTheme(){
  const green=tableTheme()==='baize';
  document.body.classList.toggle('baize',green);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute('content',green?'#062C1B':'#0F1626');
}
function toggleTheme(){
  store.set('bq_table',tableTheme()==='baize'?'midnight':'baize');
  applyTheme();
}
let flashT=null;
function flash(msg){
  let el=document.getElementById('flashbar');
  if(!el){ el=document.createElement('div'); el.id='flashbar'; document.body.appendChild(el); }
  el.className='flashbar'; el.innerHTML=msg;
  clearTimeout(flashT); flashT=setTimeout(()=>{ if(el)el.className='flashbar out'; },1900);
}
/* Vibration reality check.
   navigator.vibrate is Android and desktop Chrome only. Safari on iPhone has
   never shipped it, so on an iPhone the calls below simply do nothing.
   Apple did add a haptic tick to the switch control in Safari 17.4, which we
   can borrow, but it only fires while the browser considers a real finger
   press to be in progress. So iPhones get haptics on buttons they tap, and
   nothing for events like a partner being revealed. That is an Apple limit,
   not something the game can route around. */
const HAPTICS = { api: typeof navigator!=='undefined' && !!navigator.vibrate, sw: false, last: 'never called' };
let swEl=null;
function initSwitchHaptic(){
  try{
    const i=document.createElement('input');
    i.type='checkbox';
    if(!('switch' in i))return;          // Safari 17.4+ only
    i.setAttribute('switch','');
    i.style.cssText='position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
    document.body.appendChild(i);
    swEl=i; HAPTICS.sw=true;
  }catch(e){}
}
function switchTick(n){
  if(!swEl)return false;
  try{ for(let k=0;k<Math.max(1,Math.min(3,n));k++)swEl.checked=!swEl.checked; return true; }
  catch(e){ return false; }
}
function buzz(pat){
  if(store.get('bq_nohap')){ HAPTICS.last='turned off in settings'; return; }
  try{
    if(navigator.vibrate){ navigator.vibrate(pat); HAPTICS.last='vibrate api'; return; }
    const pulses=Array.isArray(pat)?Math.ceil(pat.length/2):1;
    if(switchTick(pulses)){ HAPTICS.last='ios switch tick'; return; }
    HAPTICS.last='no haptic support on this browser';
  }catch(e){ HAPTICS.last='error: '+(e&&e.name); }
}
function banner(cls,title,sub){
  const d=document.createElement('div'); d.className='banner '+cls;
  d.innerHTML=`<div class="bt">${title}</div>${sub?`<div class="bs">${sub}</div>`:''}`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1800);
}
const SUITCOL={S:'#EFE7D6',H:'#D9484E',D:'#4C86D8',C:'#3E9B6E'};
const SUITNAME={S:'Spades',H:'Hearts',D:'Diamonds',C:'Clubs'};
function contractCard(d){
  const col=SUITCOL[d.t]||'#EFE7D6';
  const cc=d.c.map(c=>`<span class="cc" style="color:${SUITCOL[c.s]}">${c.r}${SYM[c.s]}</span>`).join('<span style="color:var(--muted);font-size:12px"> and </span>');
  const el=document.createElement('div'); el.className='contract';
  el.innerHTML=`<div class="box">
    <div class="lab">Trump</div>

    <div class="who">${d.b} takes the contract at <b>${d.a}</b></div>
    <div class="calls"><div class="lab" style="margin-bottom:5px">Calling</div>${cc}</div>
  </div>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3200);
}
const BANNERS={
  deadcontract:['cut','Out of reach'],
  queen:   ['q',  'Black Queen'],
  trumpcut:['cut','Trump cut'],
  bigpot:  ['pot','Big pot'],
  partner: ['prt','Partner found']
};
let cutDeal=null, cutsShown=0;
function bannerWorthy(e){
  if(e.n==='queen'||e.n==='partner'||e.n==='deadcontract')return true;
  if(e.n==='bigpot'){ const m=/\+(\d+)/.exec(e.l||''); return m&&+m[1]>=30; }
  if(e.n==='trumpcut'){
    if(cutDeal!==V.dealNo){ cutDeal=V.dealNo; cutsShown=0; }
    return ++cutsShown<=1;
  }
  return false;
}
function showMoments(evts){
  const seen={};
  const dec=evts.find(e=>e.n==='declared');
  if(dec&&dec.l){ try{ contractCard(JSON.parse(dec.l)); buzz([16,70,16,70,30]); }catch(err){} }
  evts.forEach(e=>{
    const b=BANNERS[e.n]; if(!b||seen[e.n])return; seen[e.n]=1;
    if(bannerWorthy(e))banner(b[0],b[1],e.l||'');
  });
  if(seen.queen)buzz([26,40,26]);
  else if(seen.trumpcut||seen.bigpot)buzz(22);
  if(seen.partner)buzz([14,60,14]);
  if(evts.some(e=>e.n==='yourturn'))buzz(16);
  if(evts.some(e=>e.n==='made'))buzz([18,50,18,50,34]);
}
function play(names){
  if(muted||!names||!names.length)return;
  const seen=new Set();
  let n=0;
  for(const k of names){
    if(seen.has(k))continue; seen.add(k);
    if(SFX[k]&&n<3){ try{SFX[k]();}catch(e){} n++; }
  }
}
function toggleMute(){
  muted=!muted; store.set('bq_mute',muted?'1':'0');
  if(!muted){ac();SFX.yourturn();}
  render(); updateChat();
}

/* ---------- chat ---------- */
/* Tracked by message id, not by how many messages the server sent. The log is
   trimmed to the last forty, so once a table got chatty the length stopped
   growing and every later message counted as already seen. */
let chatOpen=false, lastChatId=null, unread=0, sheetEl=null;

let ws=null, V=null, seat=null, autoRejoin=false, myToken=store.get('bq_token'), myCode=store.get('bq_code');
let uiBid=MINBID, uiTrump=null, uiCalls=[], screen='home', pending=null;
let clockAt=null, clockSeat=null, pickId=null;

/* Tap to arm, tap again to play. Off by default because the extra tap is a cost
   on every single card, and only worth paying if you have actually thrown one
   away by accident. */
const confirmOn=()=>store.get('bq_confirm')==='1';
const CLOCK_SHOW=20;
function tickClock(){
  const el=document.getElementById('tclk');
  if(!el)return;
  if(!clockAt){ el.textContent=''; el.className='clk'; return; }
  const s=Math.ceil(Math.max(0,clockAt-Date.now())/1000);
  if(s>CLOCK_SHOW){ el.textContent=''; el.className='clk'; return; }
  el.textContent=s+'s';
  el.className='clk on'+(s<=6?' urgent':'');
}
setInterval(tickClock,250);

loadPack();
if(document.body)applyTheme();else document.addEventListener('DOMContentLoaded',applyTheme);
if(document.body)initSwitchHaptic();else document.addEventListener('DOMContentLoaded',initSwitchHaptic);
/* ---------- staying connected across an app switch ----------
   Leaving the game and coming back is the normal way to use a phone, and it
   used to be the way to get stuck. Two things go wrong.

   The obvious one is that the socket is closed while the app is in the
   background. onclose fires on the way back and the retry below handles it.

   The nastier one is a socket that is dead without anyone saying so. The phone
   loses the network in the reader's pocket, nothing is delivered, and the
   browser still reports the socket as open. Nothing arrives, nothing is sent,
   and the table sits there looking frozen forever. So on every return to the
   app the link is challenged: send a ping, and if nothing at all comes back
   shortly, throw the socket away and build a new one. */
let lastRx=0, reconnT=null, linkEl=null;
function linkState(up){
  if(up){ if(linkEl){ linkEl.remove(); linkEl=null; } return; }
  if(linkEl)return;
  linkEl=document.createElement('div');
  linkEl.className='linkbar';
  linkEl.textContent='Reconnecting';
  document.body.appendChild(linkEl);
}
function scheduleReconnect(delay){
  if(!myCode)return;
  clearTimeout(reconnT);
  linkState(false);
  reconnT=setTimeout(()=>{
    reconnT=null;
    if(ws&&ws.readyState===1)return;          // something else already fixed it
    if(ws){ ws.onclose=null; try{ws.close();}catch(e){} }
    autoRejoin=true;
    connect(()=>send({t:'join',code:myCode,token:myToken,name:store.get('bq_name')||''}));
  },delay);
}
function checkLink(){
  if(!myCode)return;
  if(!ws||ws.readyState!==1){ scheduleReconnect(0); return; }
  const mark=lastRx;
  send({t:'ping'});
  // the server answers immediately, so silence here means the socket is a corpse
  setTimeout(()=>{ if(lastRx===mark&&ws&&ws.readyState===1) scheduleReconnect(0); },3500);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkLink(); });
window.addEventListener('pageshow',checkLink);
window.addEventListener('focus',checkLink);
window.addEventListener('online',checkLink);

function connect(then){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host);
  ws.onopen=()=>{ lastRx=Date.now(); if(then)then(); };
  ws.onmessage=e=>{
    lastRx=Date.now();
    linkState(true);
    const m=JSON.parse(e.data);
    if(m.t==='pong')return;
    if(m.t==='seated'){ seat=m.seat; myToken=m.token; myCode=m.code;
      store.set('bq_token',myToken); store.set('bq_code',myCode); }
    else if(m.t==='state'){
      autoRejoin=false;
      V=m.v; screen=V.phase==='lobby'?'lobby':'game';
      if(V.fxId&&V.fxId!==lastFx){ lastFx=V.fxId;
        const evts=(V.fx||[]).map(e=>typeof e==='string'?{n:e,l:null}:e);
        play(evts.map(e=>e.n)); showMoments(evts); runPack(evts); }
      const c=V.chat||[];
      if(c.length){
        const newest=c[c.length-1].id||0;
        // first sight of a table: whatever was said before you arrived is not news
        if(lastChatId===null)lastChatId=newest;
        else if(newest>lastChatId){
          const fresh=c.filter(x=>(x.id||0)>lastChatId);
          lastChatId=newest;
          const inbound=fresh.filter(x=>x.i!==V.you);
          if(inbound.length&&!chatOpen){
            unread+=inbound.length;
            const last=inbound[inbound.length-1];
            chatToast(last.name,last.text);
          }
        }
      }
      // the countdown runs off a local deadline, since the phone's clock is its own
      if(typeof V.turnMs==='number'){ clockAt=Date.now()+V.turnMs; clockSeat=V.turnSeat; }
      else { clockAt=null; clockSeat=null; }
      // an armed card that is no longer playable must not stay armed
      if(pickId!==null&&!(V.phase==='play'&&V.turn===V.you&&(V.legalIds||[]).includes(pickId)))pickId=null;
      render(); updateChat();
    }
    else if(m.t==='err'){
      /* On load the app quietly tries to walk back into your last table. If that
         table is gone, because the server restarted or the room was reaped, the
         refusal is not something the player asked for and should not be shouted
         at them. Forget the stale code instead and stay on the home screen. */
      if(autoRejoin){
        autoRejoin=false;
        store.del('bq_token'); store.del('bq_code');
        myToken=null; myCode=null; seat=null;
        clearTimeout(reconnT); reconnT=null; linkState(true);
        if(ws){ ws.onclose=null; try{ws.close();}catch(e){} ws=null; }
        screen='home'; render();
        return;
      }
      toast(m.msg); if(screen==='home')render();
    }
  };
  ws.onclose=()=>{ scheduleReconnect(1500); };
}
function send(o){ if(ws&&ws.readyState===1)ws.send(JSON.stringify(o)); }
function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}
function chatToast(who,text){
  const d=document.createElement('div'); d.className='toast chat';
  d.innerHTML=`<b>${esc(who)}</b> ${esc(text)}`;
  d.onclick=()=>{d.remove();openChat();};
  document.body.appendChild(d); setTimeout(()=>d.remove(),4200);
}

/* ---------- chat sheet, lives outside the re-rendered root ---------- */
const QUICK=['Nice one','Well played','Oops','Your turn','One minute','Good bid','Bad luck','Aaya aaya'];
function buildSheet(){
  if(sheetEl)return sheetEl;
  sheetEl=document.createElement('div');
  sheetEl.className='sheet';
  sheetEl.innerHTML=`<div class="sh"><h3>Table talk</h3><span class="spacer" style="flex:1"></span>
      <button class="iconbtn" id="chatClose">Close</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <div class="compose"><input id="chatIn" maxlength="180" placeholder="Say something" autocomplete="off">
      <button class="btn" id="chatSend">Send</button></div>`;
  document.body.appendChild(sheetEl);
  sheetEl.querySelector('#chatClose').onclick=closeChat;
  const inp=sheetEl.querySelector('#chatIn');
  const fire=()=>{
    const t=inp.value.trim();
    if(!t)return;
    send({t:'chat',text:t}); inp.value='';
  };
  sheetEl.querySelector('#chatSend').onclick=fire;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')fire();});
  sheetEl.querySelector('#quick').innerHTML=QUICK.map(q=>`<button class="qb">${q}</button>`).join('');
  [...sheetEl.querySelectorAll('.qb')].forEach(b=>b.onclick=()=>send({t:'chat',text:b.textContent}));
  return sheetEl;
}
function openChat(){
  buildSheet().classList.add('open');
  chatOpen=true; unread=0;
  updateChat(); render();
  setTimeout(()=>{const m=sheetEl.querySelector('#msgs'); if(m)m.scrollTop=m.scrollHeight;},60);
}
function closeChat(){
  if(sheetEl)sheetEl.classList.remove('open');
  chatOpen=false; render();
}
function updateChat(){
  if(!sheetEl||!V)return;
  const box=sheetEl.querySelector('#msgs');
  const c=V.chat||[];
  box.innerHTML=c.length
    ? c.map(m=>`<div class="msg ${m.i===V.you?'mine':''}"><div class="who">${esc(m.name)}</div>${esc(m.text)}</div>`).join('')
    : `<div style="color:var(--muted);font-size:13px;text-align:center;padding:18px 0">Nothing said yet. Tap a phrase below or type.</div>`;
  if(chatOpen)box.scrollTop=box.scrollHeight;
}
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ================= rendering ================= */
function cardEl(c,cls){
  const qs=c.r==='Q'&&c.s==='S', v=ptsOf(c);
  return `<div class="card su-${c.s} ${qs?'qs':''} ${cls||''}" data-id="${c.id}">
    <div class="r">${c.r}</div>${v?`<div class="val">${v}</div>`:''}<div class="p">${SYM[c.s]}</div></div>`;
}
function render(){
  const R=document.getElementById('root');
  if(screen==='home')return renderHome(R);
  if(screen==='lobby')return renderLobby(R);
  renderGame(R);
}

function renderHome(R){
  R.innerHTML=`<div class="home">
    <h1>Black<br><span>Queen</span></h1>
    <p class="sub">Six or seven players, 84 cards, 200 points on the table.</p>
    <input class="fld" id="nm" maxlength="14" placeholder="Your name" value="${esc(store.get('bq_name')||'')}">
    <button class="btn block" id="mk">Start a new table</button>
    <div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:6px 0">
      <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>or join one<div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
    </div>
    <input class="fld code" id="cd" maxlength="4" placeholder="CODE">
    <button class="btn ghost block" id="jn">Join table</button>
    <div style="text-align:center;margin-top:14px"><button class="linkish" id="hr">How to play</button></div>
  </div>`;
  document.getElementById('hr').onclick=showRules;
  const nm=()=>{const v=document.getElementById('nm').value.trim()||'Player';store.set('bq_name',v);return v;};
  document.getElementById('mk').onclick=()=>{
    const n=nm(); connect(()=>send({t:'create',name:n,size:6}));
  };
  document.getElementById('jn').onclick=()=>{
    const n=nm(), c=document.getElementById('cd').value.trim().toUpperCase();
    if(c.length!==4)return toast('A table code is four letters.');
    myCode=c; connect(()=>send({t:'join',name:n,code:c}));
  };
}

  const full=V.seats.length>=V.size;
  R.innerHTML=`<div class="ribbon"><span class="deal">Table</span><span class="spacer"></span>
    <button class="iconbtn rel" id="ch">&#128172;${unread?`<span class="badge">${unread>9?'9+':unread}</span>`:''}</button>
    <button class="iconbtn" id="mu">${muted?'&#128263;':'&#128266;'}</button>
    <button class="iconbtn" id="rl">Rules</button><button class="iconbtn" id="lv">Leave</button></div>
    <div class="home" style="justify-content:flex-start;padding-top:20px">
      <div class="codebox">${V.code}</div>
      <p class="sub" style="text-align:center;margin-top:-6px">Share this code. Anyone on the link can join.</p>
      <div class="lob">${V.seats.map((s,i)=>`<div class="lobrow">
        <span><span class="dot ${s.connected?'':'off'}"></span>${esc(s.name)}${i===V.you?' (you)':''}</span>
        <span class="em">${i===V.hostSeat?'host':'seated'}</span></div>`).join('')}
        ${Array.from({length:Math.max(0,V.size-V.seats.length)},()=>`<div class="lobrow" style="opacity:.4"><span>Empty seat</span><span class="em">bot if you start now</span></div>`).join('')}
      </div>
      ${V.isHost?`<p class="sub">Table size</p>
      <div class="row" style="margin-bottom:12px">
        <button class="btn ${V.size===6?'':'quiet'} wide" data-sz="6">6 players</button>
        <button class="btn ${V.size===7?'':'quiet'} wide" data-sz="7">7 players</button>
      </div>
      <button class="btn block" id="go">${full?'Deal the cards':'Start now, bots fill the rest'}</button>`
      :`<p class="sub">Waiting for ${esc(V.seats[0]?V.seats[0].name:'the host')} to deal.</p>`}
    </div>`;
  document.getElementById('rl').onclick=showRules;
  document.getElementById('lv').onclick=leave;

  ['touchend','touchmove','touchcancel'].forEach(ev=>mu.addEventListener(ev,()=>{if(muT){clearTimeout(muT);muT=null;}},{passive:true}));
  mu.oncontextmenu=e=>{e.preventDefault();soundDiag();};
  [...R.querySelectorAll('[data-sz]')].forEach(b=>b.onclick=()=>send({t:'size',size:+b.dataset.sz}));

let handScroll=0;
function renderGame(R){
  const prevHand=R.querySelector('.hand');
  if(prevHand)handScroll=prevHand.scrollLeft;
  const me=V.you, team=new Set(V.team);
  let info='';
  if(V.trump)info+=`<span class="trumpbadge" style="color:${SUITCOL[V.trump]};border-color:${SUITCOL[V.trump]}66"><b style="font-size:15px">${SYM[V.trump]}</b> trump</span>`;
  if(V.bidAmount)info+=`<span>bid ${V.bidAmount}</span>`;
  if(V.phase==='play'||V.phase==='resolve')info+=`<span>trick ${V.trickNo}/${V.handSize}</span>`;

  const seats=V.seats.map((s,i)=>{
    const turn=(V.phase==='bid'&&V.bid&&V.bid.turn===i)||(V.phase==='play'&&V.turn===i)||(V.phase==='declare'&&V.bidder===i);
    const passed=V.phase==='bid'&&V.bid&&V.bid.passed.includes(i);
    let tag='<div class="tag"></div>';
    if(V.bidder===i)tag='<div class="tag bid">bidder</div>';
    else if(team.has(i))tag='<div class="tag mate">partner</div>';
    else if(i===me&&V.secretMate)tag='<div class="tag mate">partner (hidden)</div>';
    const onTeam=team.has(i)||(i===me&&V.secretMate);
    return `<div class="seat ${turn?'turn':''} ${i===me?'you':''} ${passed?'out':''} ${V.trump&&onTeam?'tside':''}">
      ${i===clockSeat?'<div class="clk" id="tclk"></div>':''}
      <div class="cnt">${V.phase==='bid'?'':s.cards}</div>
      <div class="nm">${s.connected?'':'<span class="dot off"></span>'}${esc(s.name)}</div>
      <div class="sc">${s.score}</div>${tag}
      ${s.won!==null&&s.won!==undefined?`<div class="tag dim">${s.won} pts</div>`:''}</div>`;
  }).join('');

  const trick=V.trick.length
    ? V.trick.map((t,k)=>`<div class="played ${k===V.trick.length-1?'nw':''}"><div style="display:flex">${cardEl(t.card,V.trump&&t.card.s===V.trump?'tr':'')}</div><div class="who">${esc(V.seats[t.p].name)}</div></div>`).join('')
    : `<div style="color:var(--muted);font-size:13px;text-align:center;max-width:260px">${idleText()}</div>`;

  const lg=V.legalIds;
  let prevSuit=null;
  const hand=V.hand.map(c=>{
    let cls=lg?(lg.includes(c.id)?'ok':'no'):'';
    if(prevSuit&&prevSuit!==c.s)cls+=' gap';
    if(V.trump&&c.s===V.trump)cls+=' tr';
    if(c.id===pickId)cls+=' sel';
    prevSuit=c.s;
    return cardEl(c,cls);
  }).join('');

  R.innerHTML=`<div class="ribbon"><span class="deal">${V.phase==='gameover'?'Final':'Round '+V.dealNo+'/'+V.totalDeals}</span>
    <span class="spacer"></span><span class="chipline">${info}</span>
    <button class="iconbtn rel" id="ch">&#128172;${unread?`<span class="badge">${unread>9?'9+':unread}</span>`:''}</button>
    <button class="iconbtn" id="mu">${muted?'&#128263;':'&#128266;'}</button>
    <button class="iconbtn hagga" id="hg">Hagga</button><button class="iconbtn" id="mo" aria-label="More">&#8943;</button></div>
    <div class="seats">${seats}</div>
    ${teamsBar()}
    <div class="table"><div class="trickarea" style="--tn:${V.n||6}">${trick}</div></div>
    <div class="handwrap"><div class="handlabel"><span>Your hand</span>
      <span>${V.hand.length?V.hand.reduce((a,c)=>a+ptsOf(c),0)+' pts in hand':''}</span></div>
      <div class="handpan"><div class="hand">${hand}</div></div></div>
    <div class="panel" id="panel"></div>
    <div class="log">${V.log.map(l=>`<div>${l}</div>`).join('')}</div>`;
  const mo=document.getElementById('mo');
  if(mo)mo.onclick=moreMenu;
  document.getElementById('ch').onclick=()=>chatOpen?closeChat():openChat();
  const mu=document.getElementById('mu');
  mu.onclick=toggleMute;
  let muT=null;
  mu.addEventListener('touchstart',()=>{ muT=setTimeout(()=>{muT=null;soundDiag();},650); },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>mu.addEventListener(ev,()=>{if(muT){clearTimeout(muT);muT=null;}},{passive:true}));
  mu.oncontextmenu=e=>{e.preventDefault();soundDiag();};
  wireHand(R.querySelector('.hand'));
  const hg=document.getElementById('hg');
  if(hg)hg.onclick=()=>{
    if(hg.disabled)return;
    ac(); buzz(14); send({t:'hagga'});
    hg.disabled=true; hg.classList.add('cool');
    setTimeout(()=>{ hg.disabled=false; hg.classList.remove('cool'); },3000);
  };
  [...R.querySelectorAll('.hand .card.ok')].forEach(el=>el.onclick=()=>{
    const id=+el.dataset.id;
    if(confirmOn()&&pickId!==id){
      pickId=id; buzz(9);
      const c=V.hand.find(x=>x.id===id);
      if(c)flash('Tap again to play '+c.r+SYM[c.s]);
      render(); return;
    }
    pickId=null; buzz(11); send({t:'play',cardId:id});
  });
  [...R.querySelectorAll('.hand .card.no')].forEach(el=>el.onclick=()=>{
    el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); buzz([9,42,9]);
    if(V.turn===V.you&&V.lead)flash('Follow '+SYM[V.lead]+' if you can');
  });
  const lt=document.getElementById('ltl');
  if(lt)lt.onclick=showLastTrick;
  renderPanel();
  tickClock();
}

function teamsBar(){
  if(!V.trump)return '';
  const team=new Set(V.team);
  const settled=V.calledDone[0]&&V.calledDone[1];
  const side=[],rest=[];
  V.seats.forEach((s,i)=>(team.has(i)?side:rest).push(i));
  const pts=list=>list.reduce((a,i)=>a+(V.seats[i].won||0),0);
  const nm=list=>list.length
    ? list.map(i=>i===V.you?`<span class="u">you</span>`:esc(V.seats[i].name)).join(' &middot; ')
    : '<span style="color:var(--muted)">nobody yet</span>';
  const restLbl=settled?'Against':'Not yet shown';
  const you=V.secretMate&&!team.has(V.you)?`<div class="hint" style="padding:0 12px 6px;margin:0">You hold a called card, so you are on the bidding side. Nobody else knows yet.</div>`:'';
  return `<div class="teams">
    <div class="tm bidside"><div class="lb">Bidding side</div><div class="nms">${nm(side)}</div><div class="pt">${pts(side)}</div></div>
    <div class="tm oppside"><div class="lb">${restLbl}</div><div class="nms">${nm(rest)}</div><div class="pt">${pts(rest)}</div></div>
  </div>${you}`;
}
function idleText(){
  if(V.phase==='declare')return 'The bidder is choosing trump and calling partners.';
  if(V.lastTrick)return `${esc(V.seats[V.lastTrick.winner].name)} took the last trick${V.lastTrick.pts?' for '+V.lastTrick.pts:''}.`
    +(V.lastTrick.cards?`<br><button class="linkish" id="ltl">See what was played</button>`:'');
  return 'The bidder leads the first trick.';
}
/* The cards are gone from the cloth within a couple of seconds, which is not
   long enough to work out how a trick went if you were looking away. */
function showLastTrick(){
  const t=V&&V.lastTrick;
  if(!t||!t.cards)return modal(`<h2>Last trick</h2><p>Nothing has been taken yet this round.</p>`);
  const cards=t.cards.map(x=>`<div class="played ${x.p===t.winner?'w':''}">
    <div style="display:flex">${cardEl(x.card,V.trump&&x.card.s===V.trump?'tr':'')}</div>
    <div class="who">${x.p===V.you?'you':esc(V.seats[x.p].name)}</div></div>`).join('');
  modal(`<h2>Trick ${t.no}</h2>
    <p>Led in ${t.lead?SYM[t.lead]+' '+NAME[t.lead]:'—'}. Taken by
      <b style="color:var(--jade)">${t.winner===V.you?'you':esc(V.seats[t.winner].name)}</b>
      for <b style="color:var(--brass)">${t.pts}</b>${t.pts===1?' point':' points'}.</p>
    <div class="ltrick">${cards}</div>`);
}
/* Round by round, because the argument about who bid what four hands ago is
   half the point of the game. */
function showScorecard(){
  const h=(V&&V.history)||[];
  if(!h.length)return modal(`<h2>Scorecard</h2><p>Nothing to show until the first round is scored.</p>`);
  const names=V.seats.map((s,i)=>i===V.you?'You':esc(s.name));
  const head=`<tr><th>Round</th><th>Contract</th>${names.map(n=>`<th>${n}</th>`).join('')}</tr>`;
  const rows=h.map(r=>{
    const won=new Set(r.winners);
    const prev=h[h.indexOf(r)-1];
    return `<tr><td>${r.deal}</td>
      <td class="bd">${esc(V.seats[r.bidder].name)} ${r.amount}${SYM[r.trump]||''}
        ${r.made?'<span style="color:var(--jade)">&#10003;</span>':'<span style="color:var(--crimson)">&times;</span>'}</td>
      ${V.seats.map((s,i)=>{
        const gain=r.scores[i]-(prev?prev.scores[i]:0);
        return `<td class="${i===V.you?'you':''} ${won.has(i)?'won':''}">${gain?'+'+gain:'&middot;'}</td>`;
      }).join('')}</tr>`;
  }).join('');
  const last=h[h.length-1];
  const tot=`<tr class="tot"><td>Total</td><td></td>${V.seats.map((s,i)=>`<td>${last.scores[i]}</td>`).join('')}</tr>`;
  modal(`<h2>Scorecard</h2><p>After ${h.length} of ${V.totalDeals} rounds. A tick means the contract was made.</p>
    <div class="cardscroll"><table class="sc">${head}${rows}${tot}</table></div>`);
}

function renderPanel(){
  const P=document.getElementById('panel'), me=V.you;
  if(V.phase==='bid'){
    const b=V.bid;
    if(b.turn!==me){
      P.innerHTML=`<h3>Bidding</h3><p>${b.high?`High bid <b style="color:var(--brass)">${b.high}</b> by ${esc(V.seats[b.highBidder].name)}.`:'Waiting for the opening bid.'} ${esc(V.seats[b.turn].name)} to act.</p>`;
      return;
    }
    const canRaise=b.min<=MAXBID;
    if(uiBid<b.min)uiBid=b.min;
    if(uiBid>MAXBID)uiBid=MAXBID;
    if(!canRaise){
      P.innerHTML=`<h3>Your bid</h3>
        <p>The bidding has reached the ceiling of 200, so there is nothing left to raise. ${esc(V.seats[b.highBidder].name)} holds it.</p>
        <div class="row"><button class="btn wide" id="bp">Pass</button></div>`;
      document.getElementById('bp').onclick=()=>{uiBid=MINBID;send({t:'pass'});};
      return;
    }
    P.innerHTML=`<h3>Your bid</h3>
      <p>${b.opened?`High bid <b style="color:var(--brass)">${b.high}</b> by ${esc(V.seats[b.highBidder].name)}.`:'You sit left of the dealer, so you must open at 100 or higher.'} Your hand holds ${V.hand.reduce((a,c)=>a+ptsOf(c),0)} points.</p>
      <div class="stepper"><button class="step" id="bd">&minus;</button><div class="amt">${uiBid}</div><button class="step" id="bu">+</button></div>
      <div class="row"><button class="btn wide" id="bo">Bid ${uiBid}</button>
      ${b.opened?'<button class="btn quiet" id="bp">Pass</button>':''}</div>`;
    document.getElementById('bd').disabled=uiBid<=b.min;
    document.getElementById('bu').disabled=uiBid>=MAXBID;
    document.getElementById('bd').onclick=()=>{uiBid-=STEP;renderPanel();};
    document.getElementById('bu').onclick=()=>{uiBid+=STEP;renderPanel();};
    document.getElementById('bo').onclick=()=>{const a=uiBid;uiBid=MINBID;send({t:'bid',amount:a});};
    if(document.getElementById('bp'))document.getElementById('bp').onclick=()=>{uiBid=MINBID;send({t:'pass'});};
    return;
  }
  if(V.phase==='declare'){
    if(V.bidder!==me){
      P.innerHTML=`<h3>Contract</h3><p>${esc(V.seats[V.bidder].name)} took it at ${V.bidAmount} and is picking trump.</p>`;
      return;
    }
    const have=new Set(V.hand.map(c=>c.r+c.s));
    const ORD=['A','K','Q','J','10','9','8','7','6','5','4'];
    P.innerHTML=`<h3>You won the bid at ${V.bidAmount}</h3><p>Pick your trump suit.</p>
      <div class="row" style="margin-bottom:12px">${SUITS.map(s=>`<button class="suitbtn su-${s} ${uiTrump===s?'on':''}" data-s="${s}">${SYM[s]}</button>`).join('')}</div>
      <p>Call any two cards in the deck. The first player to lay each one joins you.</p>
      <div style="margin-bottom:8px">${SUITS.map(s=>`<div class="callsuit">
        <div class="sl su-${s}">${SYM[s]}</div>
        <div class="callscroll">${ORD.map(r=>{const k=r+s,n=uiCalls.filter(x=>x.r+x.s===k).length;
          return `<button class="callchip mini su-${s} ${n?'on':''}" data-c="${k}">${r}${n===2?'<sup style="color:var(--brass)">&times;2</sup>':(have.has(k)?'<sup style="color:var(--brass)">&bull;</sup>':'')}</button>`;
        }).join('')}</div></div>`).join('')}</div>
      <div class="hint">Swipe each row for the lower cards. Tap the same card twice to call both copies and bring in two partners that way. A dot marks a card you already hold; call it anyway and whoever has the other copy is your partner. The 4s exist only once in the deck.</div>
      <div class="row" style="margin-bottom:8px;align-items:center">${uiCalls.length?uiCalls.map((c,i)=>`<button class="callchip su-${c.s} on" data-rm="${i}">${c.r}${SYM[c.s]} &times;</button>`).join(''):'<span class="hint" style="margin:0">No cards called yet. Tap two below.</span>'}</div>
      <button class="btn wide" id="dk" ${uiTrump&&uiCalls.length===2?'':'disabled'}>Set trump and lead</button>`;
    [...P.querySelectorAll('.suitbtn')].forEach(el=>el.onclick=()=>{uiTrump=el.dataset.s;renderPanel();});
    [...P.querySelectorAll('.callchip.mini')].forEach(el=>el.onclick=()=>{
      const k=el.dataset.c;
      if(uiCalls.length<2){
        if(k[0]==='4'&&uiCalls.some(x=>x.r+x.s===k))return toast('Only one 4 of each suit exists, so it cannot be called twice.');
        uiCalls.push({r:k.slice(0,-1),s:k.slice(-1)});
      } else toast('Two cards already called. Tap one above to remove it.');
      renderPanel();
    });
    [...P.querySelectorAll('[data-rm]')].forEach(el=>el.onclick=()=>{
      uiCalls.splice(+el.dataset.rm,1); renderPanel();
    });
    if(document.getElementById('dk'))document.getElementById('dk').onclick=()=>{
      const t=uiTrump,c=uiCalls.slice(); uiTrump=null; uiCalls=[];
      send({t:'declare',trump:t,calls:c});
    };
    return;
  }
  if(V.phase==='play'||V.phase==='resolve'){
    const team=new Set(V.team), mine=team.has(me)||V.secretMate;
    P.innerHTML=`<h3>${V.phase==='resolve'?'Taking the trick':(V.turn===me?'Your turn':esc(V.seats[V.turn].name)+' to play')}</h3>
      <p>${V.bidder===me?`You are playing for ${V.bidAmount}.`:(mine?`${V.secretMate?'You hold a called card, so you are secretly with':'You are with'} ${esc(V.seats[V.bidder].name)}, chasing ${V.bidAmount}.`:`Stop ${esc(V.seats[V.bidder].name)} from reaching ${V.bidAmount}.`)}
      Called: ${V.called.map((c,k)=>`<b style="color:${V.calledDone[k]?'var(--jade)':'var(--brass)'}">${c.r}${SYM[c.s]}</b>`).join(' and ')}. Team has ${V.teamPts} of 200.</p>`;
    return;
  }
  if(V.phase==='dealover'||V.phase==='gameover'){
    const r=V.result;
    const nmOf=i=>i===V.you?'You':esc(V.seats[i].name);
    const team=new Set(V.team);
    const sideNames=on=>V.seats.map((s,i)=>i).filter(i=>team.has(i)===on)
      .map(i=>i===V.you?`<span style="color:var(--jade)">you</span>`:esc(V.seats[i].name)).join(', ')||'nobody';
    const pAt=(r.partnerAt||[]).filter(x=>x);
    const rows=[
      ['Contract', `${esc(V.seats[V.bidder].name)} &middot; <b>${V.bidAmount}</b> &middot; ${SYM[V.trump]}`],
      ['Bidding side', `${sideNames(true)} &nbsp; <b>${r.tp}</b>`],
      ['Against', `${sideNames(false)} &nbsp; ${r.op}`],
      r.early?['Unplayed', `${r.unplayed} pts never played`]:null,
      r.big?['Biggest trick', `${nmOf(r.big.i)} &middot; <b>+${r.big.pts}</b> on trick ${r.big.no}`]:null,
      pAt.length?['Partner shown', pAt.length>1?`tricks ${pAt.join(' and ')}`:`trick ${pAt[0]}`]:['Partner shown','never'],
      r.cuts?['Most trump cuts', `${nmOf(r.cuts.i)} &middot; ${r.cuts.c}`]:null
    ].filter(Boolean);
    P.innerHTML=`<h3>${r.made?'Contract made':(r.early?'Contract dead':'Contract broken')}</h3>
      <div class="sumgrid">${rows.map(x=>`<div class="k">${x[0]}</div><div class="v">${x[1]}</div>`).join('')}</div>
      ${r.early?`<p style="margin-top:10px;color:var(--muted);font-size:12px">Both called cards were already down, so the sides above are final. The deal stopped because ${esc(V.seats[V.bidder].name)} could not reach ${V.bidAmount} even by taking every remaining point.</p>`:''}
      <p style="margin-top:11px">${r.isLast?'Final round, so scoring is at actual. ':''}<b style="color:var(--brass)">+${r.award}</b> each to ${r.winners.map(i=>esc(V.seats[i].name)).join(', ')}.</p>
      ${V.phase==='gameover'
        ? `<div class="row">${V.isHost?'<button class="btn wide" id="ag">Play another game</button>':''}<button class="btn quiet wide" id="fin">Final table</button></div>
           <div class="row" style="margin-top:8px"><button class="btn ghost wide" id="scb">Scorecard</button></div>`
        : `<div class="row"><button class="btn wide" id="nx">Next round</button><button class="btn quiet" id="scb">Scorecard</button></div><div class="hint" style="margin-top:8px">Deals automatically in a few seconds.</div>`}`;
    if(document.getElementById('scb'))document.getElementById('scb').onclick=showScorecard;
    if(document.getElementById('nx'))document.getElementById('nx').onclick=()=>send({t:'next'});
    if(document.getElementById('ag'))document.getElementById('ag').onclick=()=>send({t:'again'});
    if(document.getElementById('fin'))document.getElementById('fin').onclick=showFinal;
    if(V.phase==='gameover'&&!pending){pending=1;setTimeout(showFinal,400);}
    return;
  }
  P.innerHTML='';
}

function modal(html){
  const d=document.createElement('div'); d.className='scrim';
  d.innerHTML=`<div class="modal">${html}<div class="row" style="margin-top:14px">
    <button class="btn quiet wide" data-x>Close</button></div></div>`;
  d.onclick=e=>{if(e.target===d||e.target.hasAttribute('data-x'))d.remove();};
  document.body.appendChild(d); return d;
}
function showFinal(){
  const rank=V.seats.map((s,i)=>({s,i})).sort((a,b)=>b.s.score-a.s.score);
  modal(`<h2>Final table</h2><p>After ${V.totalDeals} rounds.</p>
    ${rank.map((x,k)=>`<div class="scoreline"><span class="${k===0?'d':''}">${k+1}. ${esc(x.s.name)}</span>
      <span class="${k===0?'d':''}" style="font-family:'Bodoni Moda',serif;font-size:15px">${x.s.score}</span></div>`).join('')}`);
}
function leave(){
  // tell the table, so a lobby seat is freed now instead of being held open
  // for the ninety second reconnect grace that a dropped phone gets
  send({t:'leave'});
  store.del('bq_token'); store.del('bq_code');
  myToken=null; myCode=null; V=null; screen='home';
  closeChat(); lastChatId=null; unread=0;
  clockAt=null; clockSeat=null; pickId=null;
  clearTimeout(reconnT); reconnT=null; linkState(true);
  // hold the socket in a local: the close is deferred so the leave actually goes out
  const sock=ws;
  if(sock){sock.onclose=null;setTimeout(()=>{try{sock.close();}catch(e){}},60);}
  ws=null;
  render();
}
function soundDiag(){
  const S={ok:['#3E9B6E','loaded'],missing:['#D9484E','NOT FOUND'],loading:['#8B93A7','loading'],error:['#D9484E','error']};
  const jl=packStatus.json==='ok'?'<span style="color:#3E9B6E">loaded</span>'
    :`<span style="color:#D9484E">${esc(packStatus.json)}</span>`;
  let rows='';
  if(PACK.length){
    const seen={};
    PACK.forEach(r=>{ if(seen[r.sound])return; seen[r.sound]=1;
      const st=S[packStatus.files[r.sound]]||S.loading;
      rows+=`<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)">
        <span style="font-family:monospace;font-size:11.5px">${esc(r.sound)}</span>
        <span style="color:${st[0]};font-size:11px;white-space:nowrap">${st[1]}</span></div>`;
    });
  }
  modal(`<h2>Sound pack</h2>
    <p style="font-size:12.5px">rules.json &nbsp;${jl}<br>rules found &nbsp;<b>${packStatus.rules===null?'none':packStatus.rules}</b>
    &nbsp;&middot;&nbsp; muted &nbsp;<b>${muted?'yes':'no'}</b>
    &nbsp;&middot;&nbsp; primed &nbsp;<b>${primed?'yes':'no'}</b></p>
    ${rows?`<div style="margin-top:10px">${rows}</div>`:'<p style="color:var(--muted);font-size:12.5px">No clips listed. If rules.json failed to load, check the file is at public/sounds/rules.json in all lowercase.</p>'}
    <h2 style="margin-top:18px">Vibration</h2>
    <p style="font-size:12.5px">
      Vibration API &nbsp;${HAPTICS.api?'<span style="color:#3E9B6E">supported</span>':'<span style="color:#D9484E">not supported</span>'}<br>
      iPhone switch tick &nbsp;${HAPTICS.sw?'<span style="color:#3E9B6E">available</span>':'<span style="color:#8B93A7">unavailable</span>'}<br>
      Last attempt &nbsp;<span style="color:var(--bone-dim)">${esc(HAPTICS.last)}</span>
    </p>
    <h2 style="margin-top:18px">Audio engine</h2>
    <p style="font-size:12.5px">
      State &nbsp;<span id="engState" style="color:${AC&&AC.state==='running'?'#3E9B6E':'#D9484E'}">${esc(AC?AC.state:'not started')}</span><br>
      Media session held &nbsp;<b>${holder&&!holder.paused?'yes':'no'}</b><br>
      Clips primed &nbsp;<b>${primed?'yes':'not since last tap'}</b>
    </p>
    <p style="color:var(--muted);font-size:11.5px;margin-top:2px">If the button says the engine is running but you still hear nothing, it is almost certainly outside the game: check the side switch on your iPhone is not set to silent, and that the volume rocker is up while this page is open, since phones keep a separate volume for media.</p>
    <button class="btn" id="wakeBtn" style="margin-top:4px">Wake audio</button>
    <button class="btn" id="hapTest" style="margin-top:4px">Test vibration</button>
    ${!HAPTICS.api?`<p style="color:var(--muted);font-size:11.5px;margin-top:10px">Safari on iPhone has never supported the Vibration API, so buzzes on game events cannot work there. Chrome and Firefox on iPhone use Apple's engine underneath, so they behave the same. Android phones do support it. If you are on Android and it still does nothing, check the phone is not in a silent mode that also suppresses vibration, and that your browser has not disabled it.</p>`:''}
    <p style="color:var(--muted);font-size:11.5px;margin-top:12px">NOT FOUND means the filename in rules.json does not match a file in public/sounds. Names are case sensitive and the extension must match too, so kartik-smit.m4a will not answer to kartik-smit.mp3.</p>`);
  wireHapTest();
  const wb=document.getElementById('wakeBtn');
  if(wb)wb.onclick=()=>{
    wb.textContent='Rebuilding...';
    holdSession();
    hardResetAudio();          // full teardown, not a resume
    primed=true; primeClips();
    setTimeout(()=>{
      try{ play(['yourturn']); }catch(e){}          // you should hear this
      checkAlive(ok=>{
        if(wb)wb.textContent = ok ? 'Engine running, did you hear it?' : 'Still silent, see note below';
        const st=document.getElementById('engState');
        if(st)st.textContent=AC?AC.state:'not started';
        setTimeout(()=>{ if(wb)wb.textContent='Wake audio'; },3200);
      });
    },160);
  };
}
function wireHapTest(){
  const b=document.getElementById('hapTest');
  if(!b)return;
  b.onclick=()=>{
    buzz([30,80,30]);
    b.textContent='Tried: '+HAPTICS.last;
    setTimeout(()=>{ if(b)b.textContent='Test vibration'; },2200);
  };
}
function wireTheme(){
  const b=document.getElementById('thBtn'), n=document.getElementById('thNext');
  if(!b)return;
  const label=()=>{ if(n)n.textContent=tableTheme()==='baize'?'midnight':'green baize'; };
  label();
  b.onclick=()=>{ toggleTheme(); label(); };
}
function moreMenu(){
  const d=modal(`<h2>Table</h2>
    <div class="row" style="flex-direction:column;gap:8px;margin-top:10px">
      <button class="btn block" data-go="score">Scorecard</button>
      <button class="btn ghost block" data-go="last">Last trick</button>
      <button class="btn ghost block" data-go="rules">How to play</button>
      <button class="btn ghost block" data-go="confirm">Confirm each card: <span id="mmConf"></span></button>
      <button class="btn ghost block" data-go="cloth">Table cloth: <span id="mmCloth"></span></button>
      <button class="btn ghost block" data-go="sound">Sound and vibration</button>
      <button class="btn quiet block" data-go="leave">Leave this table</button>
    </div>`);
  const lab=()=>{
    const e=d.querySelector('#mmCloth'); if(e)e.textContent=tableTheme()==='baize'?'green baize':'midnight';
    const c=d.querySelector('#mmConf'); if(c)c.textContent=confirmOn()?'on':'off';
  };
  lab();
  d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const g=b.getAttribute('data-go');
    if(g==='cloth'){ toggleTheme(); lab(); return; }
    if(g==='confirm'){ store.set('bq_confirm',confirmOn()?'0':'1'); pickId=null; lab(); render(); return; }
    d.remove();
    if(g==='rules')showRules();
    else if(g==='score')showScorecard();
    else if(g==='last')showLastTrick();
    else if(g==='sound')soundDiag();
    else if(g==='leave')leave();
  });
}
function showRules(){
  modal(`<h2>Black Queen</h2>
<p><b>The deck.</b> Two packs with all 2s and 3s pulled out, and the 4s from one pack only. 84 cards, so 14 each for six players or 12 each for seven.</p>
<p><b>The 200 points.</b> Every 5 and every 10 is worth 5. Every ace is 10. Each queen of spades is 20. Two of each card, so the pool is exactly 200.</p>
<p><b>Bidding.</b> The player left of the dealer must open at 100 or more. Raises go up in fives to a ceiling of 200. Once you pass you are out. Last one standing takes the contract.</p>
<p><b>The contract.</b> The bidder names trump and calls two cards. The first player to lay each called card joins the bidder's team, so three against three at six-handed and three against four at seven-handed. The bidder may call a card he holds a copy of. If he lays that copy himself, whoever holds the second copy is the partner. If one player happens to lay both called cards, he is the sole partner and the bidder plays two against the rest.</p>
<p><b>Play.</b> Follow the led suit if you can, otherwise play anything including trump. Highest trump takes the trick, or the highest card of the led suit if no trump appears. Identical cards tie in favour of whoever played first. The bidder leads the opening trick.</p>
<p><b>Scoring.</b> Make the bid and every player on the bidding team adds what the team actually collected, so bidding 120 and taking 175 pays 175. Fall short and every opponent adds the bid instead. In the final round only, a failed contract pays the opponents what they actually collected.</p>
<p><b>Length.</b> Nine rounds at six-handed, ten at seven-handed. Highest personal total wins.</p>
<h2 style="margin-top:18px">Table cloth</h2>
<p style="font-size:12.5px;color:var(--muted)">Green baize reads more clearly in normal light. Midnight is the darker original.</p>
<button class="btn" id="thBtn" style="margin-top:6px">Switch to <span id="thNext"></span></button>
`);
  wireTheme();
}

/* boot: try to rejoin an existing table */
if(myCode&&myToken){ autoRejoin=true; connect(()=>send({t:'join',code:myCode,token:myToken,name:store.get('bq_name')||''})); }
render();
</script>
