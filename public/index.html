<script>
const SUITS=['S','H','D','C'];
const SYM={S:'\u2660',H:'\u2665',D:'\u2666',C:'\u2663'};
const NAME={S:'Spades',H:'Hearts',D:'Diamonds',C:'Clubs'};
const RED={H:1,D:1};
const RANKS=['5','6','7','8','9','10','J','Q','K','A'];
const MINBID=100,MAXBID=200,STEP=5;
const ptsOf=c=>(c.r==='5'||c.r==='10')?5:c.r==='A'?10:(c.r==='Q'&&c.s==='S')?20:0;

/* storage that never throws */
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- sound, synthesised in the browser ---------- */
let AC=null, muted=store.get('bq_mute')==='1', lastFx=0;
function ac(){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null}
}
document.addEventListener('pointerdown',()=>{
  if(!muted)ac();
  if(primed)return; primed=true;
  Object.values(audioCache).forEach(a=>{
    try{ const v=a.volume; a.volume=0;
      const q=a.play();
      if(q&&q.then)q.then(()=>{ a.pause(); a.currentTime=0; a.volume=v; }).catch(()=>{ a.volume=v; });
      else { a.pause(); a.currentTime=0; a.volume=v; }
    }catch(e){}
  });
},{passive:true});
function env(g,t,a,d,peak){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
}
function blip(f1,f2,dur,peak,type,at){
  const C=ac(); if(!C)return;
  const t=C.currentTime+(at||0);
  const o=C.createOscillator(), g=C.createGain();
  o.type=type||'triangle';
  o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,0.008,dur,peak);
  o.connect(g); g.connect(C.destination);
  o.start(t); o.stop(t+dur+0.06);
}
function noise(dur,peak,f0,f1,at){
  const C=ac(); if(!C)return;
  const t=C.currentTime+(at||0);
  const n=Math.floor(C.sampleRate*dur);
  const buf=C.createBuffer(1,n,C.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=C.createBufferSource(); src.buffer=buf;
  const bp=C.createBiquadFilter(); bp.type='bandpass'; bp.Q=1.1;
  bp.frequency.setValueAtTime(f0,t);
  bp.frequency.exponentialRampToValueAtTime(f1||f0,t+dur);
  const g=C.createGain(); env(g,t,0.006,dur,peak);
  src.connect(bp); bp.connect(g); g.connect(C.destination);
  src.start(t); src.stop(t+dur+0.05);
}

  card(){ noise(0.06,0.10,1700,900); },
  trumpcut(){ noise(0.20,0.30,5200,700); blip(520,120,0.24,0.22,'sawtooth',0.02); },
  queen(){ blip(196,196,0.30,0.20,'sine'); blip(147,147,0.42,0.17,'sine',0.10); },
  trickwin(){ blip(587,587,0.12,0.17,'triangle'); blip(880,880,0.20,0.15,'triangle',0.10); },

  contract(){ [392,494,587].forEach((f,i)=>blip(f,f,0.34,0.12,'triangle',i*0.05)); },

/* ============ CUSTOM SOUND PACK ============
   Drop mp3 files in public/sounds/ and describe them in public/sounds/rules.json.
   Nothing here is required: if the folder is missing the game runs exactly as before. */
let PACK=[], packReady=false, packFired={}, primed=false;
const packStatus={ rules:null, files:{}, json:'loading' };
const audioCache={};
function loadPack(){
  fetch('sounds/rules.json',{cache:'no-cache'})
    .then(r=>{ packStatus.json=r.ok?'ok':('http '+r.status); return r.ok?r.json():null; })
    .then(j=>{ if(!Array.isArray(j))return;
      PACK=j.filter(r=>r&&r.when&&r.sound); packReady=true; packStatus.rules=PACK.length;
      PACK.forEach(r=>{ try{
        if(audioCache[r.sound])return;
        const a=new Audio('sounds/'+r.sound); a.preload='auto';
        a.volume=typeof r.volume==='number'?Math.max(0,Math.min(1,r.volume)):0.9;
        packStatus.files[r.sound]='loading';
        a.addEventListener('canplaythrough',()=>{packStatus.files[r.sound]='ok';},{once:true});
        a.addEventListener('error',()=>{packStatus.files[r.sound]='missing';},{once:true});
        audioCache[r.sound]=a;
      }catch(e){ packStatus.files[r.sound]='error'; } });
      console.log('sound pack loaded:',PACK.length,'rules');
    })
    .catch(e=>{ packStatus.json='failed'; });
}
const norm=x=>String(x==null?'':x).trim().toLowerCase();
function namesIn(d){
  const out=[];
  if(d.who)out.push(d.who);
  if(d.bidder)out.push(d.bidder);
  if(Array.isArray(d.team))out.push(...d.team);
  if(Array.isArray(d.winners))out.push(...d.winners);
  return out.map(norm);
}
function ruleMatches(r,e){
  if(norm(r.when)!==norm(e.n))return false;
  const d=e.d||{};
  // every listed player must be involved in this event
  if(Array.isArray(r.players)&&r.players.length){
    const pool=(r.when==='partner'||r.when==='sweep'||r.when==='gamewinner')&&Array.isArray(d.team)
      ?d.team.map(norm):namesIn(d);
    // a nested array means "any one of these will do"
    const ok=r.players.every(x=>Array.isArray(x)
      ?x.some(y=>pool.includes(norm(y)))
      :pool.includes(norm(x)));
    if(!ok)return false;
  }
  if(r.player){
    const want=Array.isArray(r.player)?r.player.map(norm):[norm(r.player)];
    if(!want.includes(norm(d.who))&&!want.includes(norm(d.bidder)))return false;
  }
  if(r.side&&norm(r.side)!==norm(d.side))return false;
  if(r.when==='partner'&&r.settled&&!d.settled)return false;
  if(r.sole===true&&!d.sole)return false;
  if(typeof r.minPoints==='number'&&!(d.pts>=r.minPoints))return false;
  if(r.trump&&norm(d.trump||d.suit)!==norm(r.trump))return false;
  if(typeof r.minBid==='number'&&!(d.amount>=r.minBid))return false;
  return true;
}
function packPlay(r){
  if(muted)return;
  const a=audioCache[r.sound];
  if(!a){ console.warn('sound pack: no audio for',r.sound); return; }
  try{ a.currentTime=0; const q=a.play();
    if(q&&q.catch)q.catch(e=>console.warn('sound pack: blocked or missing',r.sound,e&&e.name)); }catch(e){}
  if(r.text)flash(r.text);
  if(r.buzz)buzz([18,60,18]);
}
function runPack(evts){
  if(!packReady||!PACK.length)return;
  evts.forEach(e=>{
    PACK.forEach((r,i)=>{
      if(!ruleMatches(r,e))return;
      const scope=r.once||'deal';
      const key=i+'|'+(scope==='deal'?('d'+V.dealNo):scope==='game'?'g':Math.random());
      if(scope!=='always'&&packFired[key])return;
      packFired[key]=1;
      packPlay(r);
    });
  });
}
function wireHand(el){
  if(!el)return;
  // put the view back where it was before the re-render
  el.scrollLeft=handScroll;
  const maxLeft=()=>el.scrollWidth-el.clientWidth;
  const wrap=el.parentElement;
  const fades=()=>{
    if(!wrap)return;
    wrap.classList.toggle('fl',el.scrollLeft>4);
    wrap.classList.toggle('fr',el.scrollLeft<maxLeft()-4);
  };
  el.addEventListener('scroll',()=>{ handScroll=el.scrollLeft; fades(); },{passive:true});
  // a plain wheel is vertical, so send it sideways instead
  el.addEventListener('wheel',e=>{
    if(maxLeft()<=0)return;
    const dx=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if(!dx)return;
    const before=el.scrollLeft;
    el.scrollLeft=Math.max(0,Math.min(maxLeft(),before+dx));
    if(el.scrollLeft!==before)e.preventDefault();
  },{passive:false});
  // click and drag to pan, without swallowing a real click on a card
  let down=false,sx=0,sl=0,moved=0;
  el.addEventListener('mousedown',e=>{
    if(e.button!==0||maxLeft()<=0)return;
    down=true; moved=0; sx=e.clientX; sl=el.scrollLeft; el.classList.add('grab');
  });
  window.addEventListener('mousemove',e=>{
    if(!down)return;
    const d=e.clientX-sx; moved=Math.max(moved,Math.abs(d));
    if(moved>3){ el.scrollLeft=Math.max(0,Math.min(maxLeft(),sl-d)); e.preventDefault(); }
  });
  window.addEventListener('mouseup',()=>{
    if(!down)return;
    down=false; el.classList.remove('grab');
    // a drag should not also play the card it started on
    if(moved>6){ el.classList.add('dragged'); setTimeout(()=>el.classList.remove('dragged'),0); }
  });
  el.addEventListener('click',e=>{ if(el.classList.contains('dragged')){ e.stopPropagation(); e.preventDefault(); } },true);
  fades();
}

  bigpot:  ['pot','Big pot'],
  partner: ['prt','Partner found']

let cutDeal=null, cutsShown=0;
function bannerWorthy(e){
  if(e.n==='queen'||e.n==='partner')return true;
  if(e.n==='bigpot'){ const m=/\+(\d+)/.exec(e.l||''); return m&&+m[1]>=30; }

}
function showMoments(evts){

  });

function play(names){

  const lg=V.legalIds;
  let prevSuit=null;
  const hand=V.hand.map(c=>{
    let cls=lg?(lg.includes(c.id)?'ok':'no'):'';
    if(prevSuit&&prevSuit!==c.s)cls+=' gap';
    if(V.trump&&c.s===V.trump)cls+=' tr';
    prevSuit=c.s;
    return cardEl(c,cls);
  }).join('');

  R.innerHTML=`<div class="ribbon"><span class="deal">${V.phase==='gameover'?'Final':'Round '+V.dealNo+'/'+V.totalDeals}</span>
    <span class="spacer"></span><span class="chipline">${info}</span>
    <button class="iconbtn rel" id="ch">&#128172;${unread?`<span class="badge">${unread>9?'9+':unread}</span>`:''}</button>
    <button class="iconbtn" id="mu">${muted?'&#128263;':'&#128266;'}</button>
    <button class="iconbtn hagga" id="hg">Hagga</button><button class="iconbtn" id="rl">?</button><button class="iconbtn" id="lv">Exit</button></div>
    <div class="seats">${seats}</div>
    ${teamsBar()}
    <div class="table"><div class="trickarea">${trick}</div></div>
    <div class="handwrap"><div class="handlabel"><span>Your hand</span>
      <span>${V.hand.length?V.hand.reduce((a,c)=>a+ptsOf(c),0)+' pts in hand':''}</span></div>
      <div class="handpan"><div class="hand">${hand}</div></div></div>
    <div class="panel" id="panel"></div>
    <div class="log">${V.log.map(l=>`<div>${l}</div>`).join('')}</div>`;
  document.getElementById('rl').onclick=showRules;
  document.getElementById('lv').onclick=leave;
  document.getElementById('ch').onclick=()=>chatOpen?closeChat():openChat();
  const mu=document.getElementById('mu');
  mu.onclick=toggleMute;
  let muT=null;
  mu.addEventListener('touchstart',()=>{ muT=setTimeout(()=>{muT=null;soundDiag();},650); },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>mu.addEventListener(ev,()=>{if(muT){clearTimeout(muT);muT=null;}},{passive:true}));
  mu.oncontextmenu=e=>{e.preventDefault();soundDiag();};
  wireHand(R.querySelector('.hand'));
  const hg=document.getElementById('hg');
  if(hg)hg.onclick=()=>{
    if(hg.disabled)return;
    ac(); buzz(14); send({t:'hagga'});
    hg.disabled=true; hg.classList.add('cool');
    setTimeout(()=>{ hg.disabled=false; hg.classList.remove('cool'); },3000);
  };
  [...R.querySelectorAll('.hand .card.ok')].forEach(el=>el.onclick=()=>{ buzz(11); send({t:'play',cardId:+el.dataset.id}); });
  [...R.querySelectorAll('.hand .card.no')].forEach(el=>el.onclick=()=>{
    el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); buzz([9,42,9]);
    if(V.turn===V.you&&V.lead)flash('Follow '+SYM[V.lead]+' if you can');
  });
  renderPanel();
}

function teamsBar(){
  if(!V.trump)return '';
  const team=new Set(V.team);
  const settled=V.calledDone[0]&&V.calledDone[1];
  const side=[],rest=[];
  V.seats.forEach((s,i)=>(team.has(i)?side:rest).push(i));
  const pts=list=>list.reduce((a,i)=>a+(V.seats[i].won||0),0);
  const nm=list=>list.length
    ? list.map(i=>i===V.you?`<span class="u">you</span>`:esc(V.seats[i].name)).join(' &middot; ')
    : '<span style="color:var(--muted)">nobody yet</span>';
  const restLbl=settled?'Against':'Not yet shown';
  const you=V.secretMate&&!team.has(V.you)?`<div class="hint" style="padding:0 12px 6px;margin:0">You hold a called card, so you are on the bidding side. Nobody else knows yet.</div>`:'';
  return `<div class="teams">
    <div class="tm bidside"><div class="lb">Bidding side</div><div class="nms">${nm(side)}</div><div class="pt">${pts(side)}</div></div>
    <div class="tm oppside"><div class="lb">${restLbl}</div><div class="nms">${nm(rest)}</div><div class="pt">${pts(rest)}</div></div>
  </div>${you}`;
}
function idleText(){
  if(V.phase==='declare')return 'The bidder is choosing trump and calling partners.';
  if(V.lastTrick)return `${esc(V.seats[V.lastTrick.winner].name)} took the last trick${V.lastTrick.pts?' for '+V.lastTrick.pts:''}.`;
  return 'The bidder leads the first trick.';
}

function renderPanel(){
  const P=document.getElementById('panel'), me=V.you;
  if(V.phase==='bid'){
    const b=V.bid;
    if(b.turn!==me){
      P.innerHTML=`<h3>Bidding</h3><p>${b.high?`High bid <b style="color:var(--brass)">${b.high}</b> by ${esc(V.seats[b.highBidder].name)}.`:'Waiting for the opening bid.'} ${esc(V.seats[b.turn].name)} to act.</p>`;
      return;
    }
    const canRaise=b.min<=MAXBID;
    if(uiBid<b.min)uiBid=b.min;
    if(uiBid>MAXBID)uiBid=MAXBID;
    if(!canRaise){
      P.innerHTML=`<h3>Your bid</h3>
        <p>The bidding has reached the ceiling of 200, so there is nothing left to raise. ${esc(V.seats[b.highBidder].name)} holds it.</p>
        <div class="row"><button class="btn wide" id="bp">Pass</button></div>`;
      document.getElementById('bp').onclick=()=>{uiBid=MINBID;send({t:'pass'});};
      return;
    }
    P.innerHTML=`<h3>Your bid</h3>
      <p>${b.opened?`High bid <b style="color:var(--brass)">${b.high}</b> by ${esc(V.seats[b.highBidder].name)}.`:'You sit left of the dealer, so you must open at 100 or higher.'} Your hand holds ${V.hand.reduce((a,c)=>a+ptsOf(c),0)} points.</p>
      <div class="stepper"><button class="step" id="bd">&minus;</button><div class="amt">${uiBid}</div><button class="step" id="bu">+</button></div>
      <div class="row"><button class="btn wide" id="bo">Bid ${uiBid}</button>
      ${b.opened?'<button class="btn quiet" id="bp">Pass</button>':''}</div>`;
    document.getElementById('bd').disabled=uiBid<=b.min;
    document.getElementById('bu').disabled=uiBid>=MAXBID;
    document.getElementById('bd').onclick=()=>{uiBid-=STEP;renderPanel();};
    document.getElementById('bu').onclick=()=>{uiBid+=STEP;renderPanel();};
    document.getElementById('bo').onclick=()=>{const a=uiBid;uiBid=MINBID;send({t:'bid',amount:a});};
    if(document.getElementById('bp'))document.getElementById('bp').onclick=()=>{uiBid=MINBID;send({t:'pass'});};
    return;
  }
  if(V.phase==='declare'){
    if(V.bidder!==me){
      P.innerHTML=`<h3>Contract</h3><p>${esc(V.seats[V.bidder].name)} took it at ${V.bidAmount} and is picking trump.</p>`;
      return;
    }
    const have=new Set(V.hand.map(c=>c.r+c.s));
    const ORD=['A','K','Q','J','10','9','8','7','6','5','4'];
    P.innerHTML=`<h3>You won the bid at ${V.bidAmount}</h3><p>Pick your trump suit.</p>
      <div class="row" style="margin-bottom:12px">${SUITS.map(s=>`<button class="suitbtn su-${s} ${uiTrump===s?'on':''}" data-s="${s}">${SYM[s]}</button>`).join('')}</div>
      <p>Call any two cards in the deck. The first player to lay each one joins you.</p>
      <div style="margin-bottom:8px">${SUITS.map(s=>`<div class="callsuit">
        <div class="sl su-${s}">${SYM[s]}</div>
        <div class="callscroll">${ORD.map(r=>{const k=r+s,n=uiCalls.filter(x=>x.r+x.s===k).length;
          return `<button class="callchip mini su-${s} ${n?'on':''}" data-c="${k}">${r}${n===2?'<sup style="color:var(--brass)">&times;2</sup>':(have.has(k)?'<sup style="color:var(--brass)">&bull;</sup>':'')}</button>`;
        }).join('')}</div></div>`).join('')}</div>
      <div class="hint">Swipe each row for the lower cards. Tap the same card twice to call both copies and bring in two partners that way. A dot marks a card you already hold; call it anyway and whoever has the other copy is your partner. The 4s exist only once in the deck.</div>
      <div class="row" style="margin-bottom:8px;align-items:center">${uiCalls.length?uiCalls.map((c,i)=>`<button class="callchip su-${c.s} on" data-rm="${i}">${c.r}${SYM[c.s]} &times;</button>`).join(''):'<span class="hint" style="margin:0">No cards called yet. Tap two below.</span>'}</div>
      <button class="btn wide" id="dk" ${uiTrump&&uiCalls.length===2?'':'disabled'}>Set trump and lead</button>`;
    [...P.querySelectorAll('.suitbtn')].forEach(el=>el.onclick=()=>{uiTrump=el.dataset.s;renderPanel();});
    [...P.querySelectorAll('.callchip.mini')].forEach(el=>el.onclick=()=>{
      const k=el.dataset.c;
      if(uiCalls.length<2){
        if(k[0]==='4'&&uiCalls.some(x=>x.r+x.s===k))return toast('Only one 4 of each suit exists, so it cannot be called twice.');
        uiCalls.push({r:k.slice(0,-1),s:k.slice(-1)});
      } else toast('Two cards already called. Tap one above to remove it.');
      renderPanel();
    });
    [...P.querySelectorAll('[data-rm]')].forEach(el=>el.onclick=()=>{
      uiCalls.splice(+el.dataset.rm,1); renderPanel();
    });
    if(document.getElementById('dk'))document.getElementById('dk').onclick=()=>{
      const t=uiTrump,c=uiCalls.slice(); uiTrump=null; uiCalls=[];
      send({t:'declare',trump:t,calls:c});
    };
    return;
  }
  if(V.phase==='play'||V.phase==='resolve'){
    const team=new Set(V.team), mine=team.has(me)||V.secretMate;
    P.innerHTML=`<h3>${V.phase==='resolve'?'Taking the trick':(V.turn===me?'Your turn':esc(V.seats[V.turn].name)+' to play')}</h3>
      <p>${V.bidder===me?`You are playing for ${V.bidAmount}.`:(mine?`${V.secretMate?'You hold a called card, so you are secretly with':'You are with'} ${esc(V.seats[V.bidder].name)}, chasing ${V.bidAmount}.`:`Stop ${esc(V.seats[V.bidder].name)} from reaching ${V.bidAmount}.`)}
      Called: ${V.called.map((c,k)=>`<b style="color:${V.calledDone[k]?'var(--jade)':'var(--brass)'}">${c.r}${SYM[c.s]}</b>`).join(' and ')}. Team has ${V.teamPts} of 200.</p>`;
    return;
  }
  if(V.phase==='dealover'||V.phase==='gameover'){
    const r=V.result;
    const nmOf=i=>i===V.you?'You':esc(V.seats[i].name);
    const pAt=(r.partnerAt||[]).filter(x=>x);
    const rows=[
      ['Contract', `${esc(V.seats[V.bidder].name)} &middot; <b>${V.bidAmount}</b> &middot; ${SYM[V.trump]}`],
      ['Bidding side', `<b>${r.tp}</b>`],
      ['Against', `${r.op}`],
      r.big?['Biggest trick', `${nmOf(r.big.i)} &middot; <b>+${r.big.pts}</b> on trick ${r.big.no}`]:null,
      pAt.length?['Partner shown', pAt.length>1?`tricks ${pAt.join(' and ')}`:`trick ${pAt[0]}`]:['Partner shown','never'],
      r.cuts?['Most trump cuts', `${nmOf(r.cuts.i)} &middot; ${r.cuts.c}`]:null
    ].filter(Boolean);
    P.innerHTML=`<h3>${r.made?'Contract made':'Contract broken'}</h3>
      <div class="sumgrid">${rows.map(x=>`<div class="k">${x[0]}</div><div class="v">${x[1]}</div>`).join('')}</div>
      <p style="margin-top:11px">${r.isLast?'Final round, so scoring is at actual. ':''}<b style="color:var(--brass)">+${r.award}</b> each to ${r.winners.map(i=>esc(V.seats[i].name)).join(', ')}.</p>
      ${V.phase==='gameover'
        ? `<div class="row">${V.you===0?'<button class="btn wide" id="ag">Play another game</button>':''}<button class="btn quiet wide" id="fin">Final table</button></div>`
        : `<div class="row"><button class="btn wide" id="nx">Next round</button></div><div class="hint" style="margin-top:8px">Deals automatically in a few seconds.</div>`}`;
    if(document.getElementById('nx'))document.getElementById('nx').onclick=()=>send({t:'next'});
    if(document.getElementById('ag'))document.getElementById('ag').onclick=()=>send({t:'again'});
    if(document.getElementById('fin'))document.getElementById('fin').onclick=showFinal;
    if(V.phase==='gameover'&&!pending){pending=1;setTimeout(showFinal,400);}
    return;
  }
  P.innerHTML='';
}

function modal(html){
  const d=document.createElement('div'); d.className='scrim';
  d.innerHTML=`<div class="modal">${html}<div class="row" style="margin-top:14px">
    <button class="btn quiet wide" data-x>Close</button></div></div>`;
  d.onclick=e=>{if(e.target===d||e.target.hasAttribute('data-x'))d.remove();};
  document.body.appendChild(d); return d;
}
function showFinal(){
  const rank=V.seats.map((s,i)=>({s,i})).sort((a,b)=>b.s.score-a.s.score);
  modal(`<h2>Final table</h2><p>After ${V.totalDeals} rounds.</p>
    ${rank.map((x,k)=>`<div class="scoreline"><span class="${k===0?'d':''}">${k+1}. ${esc(x.s.name)}</span>
      <span class="${k===0?'d':''}" style="font-family:'Bodoni Moda',serif;font-size:15px">${x.s.score}</span></div>`).join('')}`);
}
function leave(){
  store.del('bq_token'); store.del('bq_code');
  myToken=null; myCode=null; V=null; screen='home';
  closeChat(); seenChat=0; unread=0;
  if(ws){ws.onclose=null;ws.close();ws=null;}
  render();
}
function soundDiag(){
  const S={ok:['#3E9B6E','loaded'],missing:['#D9484E','NOT FOUND'],loading:['#8B93A7','loading'],error:['#D9484E','error']};
  const jl=packStatus.json==='ok'?'<span style="color:#3E9B6E">loaded</span>'
    :`<span style="color:#D9484E">${esc(packStatus.json)}</span>`;
  let rows='';
  if(PACK.length){
    const seen={};
    PACK.forEach(r=>{ if(seen[r.sound])return; seen[r.sound]=1;
      const st=S[packStatus.files[r.sound]]||S.loading;
      rows+=`<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)">
        <span style="font-family:monospace;font-size:11.5px">${esc(r.sound)}</span>
        <span style="color:${st[0]};font-size:11px;white-space:nowrap">${st[1]}</span></div>`;
    });
  }
  modal(`<h2>Sound pack</h2>
    <p style="font-size:12.5px">rules.json &nbsp;${jl}<br>rules found &nbsp;<b>${packStatus.rules===null?'none':packStatus.rules}</b>
    &nbsp;&middot;&nbsp; muted &nbsp;<b>${muted?'yes':'no'}</b>
    &nbsp;&middot;&nbsp; primed &nbsp;<b>${primed?'yes':'no'}</b></p>
    ${rows?`<div style="margin-top:10px">${rows}</div>`:'<p style="color:var(--muted);font-size:12.5px">No clips listed. If rules.json failed to load, check the file is at public/sounds/rules.json in all lowercase.</p>'}
    <p style="color:var(--muted);font-size:11.5px;margin-top:12px">NOT FOUND means the filename in rules.json does not match a file in public/sounds. Names are case sensitive and the extension must match too, so kartik-smit.m4a will not answer to kartik-smit.mp3.</p>`);
}
function showRules(){
  modal(`<h2>Black Queen</h2>
<p><b>The deck.</b> Two packs with all 2s and 3s pulled out, and the 4s from one pack only. 84 cards, so 14 each for six players or 12 each for seven.</p>
<p><b>The 200 points.</b> Every 5 and every 10 is worth 5. Every ace is 10. Each queen of spades is 20. Two of each card, so the pool is exactly 200.</p>
<p><b>Bidding.</b> The player left of the dealer must open at 100 or more. Raises go up in fives to a ceiling of 200. Once you pass you are out. Last one standing takes the contract.</p>
<p><b>The contract.</b> The bidder names trump and calls two cards. The first player to lay each called card joins the bidder's team, so three against three at six-handed and three against four at seven-handed. The bidder may call a card he holds a copy of. If he lays that copy himself, whoever holds the second copy is the partner. If one player happens to lay both called cards, he is the sole partner and the bidder plays two against the rest.</p>
<p><b>Play.</b> Follow the led suit if you can, otherwise play anything including trump. Highest trump takes the trick, or the highest card of the led suit if no trump appears. Identical cards tie in favour of whoever played first. The bidder leads the opening trick.</p>
<p><b>Scoring.</b> Make the bid and every player on the bidding team adds what the team actually collected, so bidding 120 and taking 175 pays 175. Fall short and every opponent adds the bid instead. In the final round only, a failed contract pays the opponents what they actually collected.</p>
<p><b>Length.</b> Nine rounds at six-handed, ten at seven-handed. Highest personal total wins.</p>`);
}

/* boot: try to rejoin an existing table */
if(myCode&&myToken){ connect(()=>send({t:'join',code:myCode,token:myToken})); }
render();
</script>
</body>
</html>
